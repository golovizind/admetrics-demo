<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admetrics</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg1:#eef0ff; --bg2:#f0fbff; --bg3:#fdf0ff;
  --card:#ffffff; --fg:#1a1d2b; --dim:#8b90a6;
  --line:rgba(20,22,40,.08);
  --accent:#6b5cff; --btn:#6b5cff; --btn-fg:#fff;
  --ok:#20c997; --warn:#ff9f43; --bad:#ff5b6e;
  --grad-purple:linear-gradient(135deg,#a78bfa 0%,#8b7bff 60%,#7c6cff 100%);
  --grad-teal:linear-gradient(135deg,#5ee7c4 0%,#3ddc97 60%,#2bd3b0 100%);
  --shadow:0 8px 24px rgba(80,70,160,.10);
}
:root[data-theme="dark"]{
  --bg1:#14161f; --bg2:#12141c; --bg3:#17141f;
  --card:#1e2230; --fg:#f2f3fa; --dim:#8b90a6; --line:rgba(255,255,255,.08);
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:88px;
  background:
    radial-gradient(120% 80% at 0% 0%, var(--bg1) 0%, transparent 55%),
    radial-gradient(120% 80% at 100% 10%, var(--bg3) 0%, transparent 50%),
    linear-gradient(180deg, var(--bg2), var(--bg1));
  background-attachment:fixed;}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
/* Заголовок раздела — единственное, что делит длинную карточку на части.
   Раньше он был почти незаметен, и экран читался одной сплошной плитой. */
h2{font-size:11.5px;margin:26px 0 11px;color:var(--dim);font-weight:700;
  text-transform:uppercase;letter-spacing:.07em}
.sub{color:var(--dim);font-size:13px;margin:0 0 14px}
a{color:var(--accent)}

/* Шапка с аватаром */
.head{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;position:relative;
  background:var(--grad-purple)}
.avatar>img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;
  object-fit:cover}
.tgav{width:38px;height:38px;border-radius:50%;flex-shrink:0;position:relative;
  background:var(--grad-purple);overflow:hidden;display:inline-block}
.tgav>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mgroup>summary .tgav{width:26px;height:26px}
.avatar .live{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;
  border-radius:50%;background:var(--ok);border:3px solid var(--bg1)}
.head .who{font-size:19px;font-weight:700}

/* Период — пилюли в белой капсуле */
.chips{display:flex;gap:6px;overflow-x:auto;padding:5px;margin-bottom:14px;
  background:var(--card);border-radius:999px;box-shadow:var(--shadow);
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:9px 15px;border-radius:999px;border:0;
  color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;background:none;
  font-family:inherit}
.chip.on{background:color-mix(in srgb,var(--accent) 12%,var(--card));
  color:var(--accent)}
.chip.sm{padding:7px 12px;font-size:12px}
/* Свой период. Поля дат стоят отдельной строкой под чипами: втискивать их
   в ленту значит либо ломать прокрутку, либо делать их непопадаемыми. */
.chips.range{padding:8px 10px;gap:8px;align-items:center;overflow:visible}
.chips.range .day{width:auto;flex:1 1 130px;min-width:120px;padding:8px 10px;
  border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--fg);font-family:inherit;font-size:13px}
.chips.range .lab{color:var(--dim);font-size:13px;flex:none}
.chips.range .go{background:var(--btn);color:var(--btn-fg);font-weight:700;
  flex:none}
@media (max-width:420px){ .chips.range{flex-wrap:wrap}
  .chips.range .go{width:100%} }
.chip .i{margin-right:5px}

.stack>*{margin-bottom:12px}
.stack>h2{margin-top:20px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.kpi.hero{grid-column:1 / -1;background:var(--grad-purple);color:#fff;
  box-shadow:0 12px 30px rgba(124,108,255,.35)}
.kpi.grad{background:var(--grad-teal);color:#08312a;
  box-shadow:0 12px 30px rgba(45,211,176,.3)}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  opacity:.8;font-weight:600}
.kpi .v{font-size:30px;font-weight:800;margin-top:6px;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.05}
.kpi.hero .v,.kpi.grad .v{font-size:34px}
.kpi:not(.hero):not(.grad) .v{font-size:24px}
.kpi .n{font-size:12.5px;margin-top:5px;opacity:.75}

/* График по дням: своя сетка, подписи осей и значения. Голая линия без шкал
   отвечала только на «вверх или вниз», а спрашивают всегда «сколько и когда». */
.chartbox{position:relative;margin-top:12px}
.chartbox svg{display:block;width:100%;overflow:visible}
.chartbox .ax{fill:var(--dim);font-size:10.5px;font-weight:600;
  font-variant-numeric:tabular-nums}
.chartbox .gl{stroke:var(--line);stroke-width:1}
.chartbox .vl{fill:var(--fg);font-size:10.5px;font-weight:700;
  font-variant-numeric:tabular-nums}
.chartbox .hit{fill:transparent;cursor:crosshair}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:6px 10px;
  box-shadow:var(--shadow);font-size:11.5px;color:var(--dim);white-space:nowrap;
  transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .1s}
.tip b{display:block;font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}
.chartlegend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* Панель управления кампанией: действия рядом с цифрами, а не на другом экране. */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}
.ctl button{border:0;border-radius:11px;padding:9px 14px;font-family:inherit;
  font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;
  align-items:center;gap:7px;
  background:color-mix(in srgb,var(--accent) 11%,var(--card));color:var(--accent)}
.ctl button.stop{background:color-mix(in srgb,var(--bad) 13%,var(--card));color:#e0304a}
.ctl button.go{background:color-mix(in srgb,var(--ok) 15%,var(--card));color:#12a67e}
.ctl button:disabled{opacity:.5;cursor:default}
.ctl input{width:110px;padding:9px 11px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);font-family:inherit;font-size:13px;
  font-variant-numeric:tabular-nums}
.ctl .lab{color:var(--dim);font-size:12.5px;font-weight:600}
.ctlnote{font-size:12.5px;margin-top:8px;color:var(--dim)}
details.tgform>summary{list-style:none;cursor:pointer}
details.tgform>summary::-webkit-details-marker{display:none}
details.tgform>summary h2{display:flex;align-items:center;gap:6px}
.ctlnote.bad{color:#e0304a} .ctlnote.ok{color:#12a67e}

/* Иконки. Один спрайт на весь портал, цвет и размер наследуются от текста —
   поэтому иконка в кнопке, в заголовке и в строке списка выглядит частью
   текста, а не наклейкой поверх него. Эмодзи так не умеют: их рисует
   операционная система, и на каждой они разные. */
.i{width:1.05em;height:1.05em;flex:none;vertical-align:-.16em;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.name>.i:first-child,.act .i,.n>.i:first-child{margin-right:8px}
.i.ok{color:var(--ok)} .i.bad{color:var(--bad)}
.i.warn{color:var(--warn)} .i.dim{color:var(--dim)}
.dot.info{background:var(--accent)}

/* Карточки идут подряд и раньше слипались: отступ был только внутри .stack,
   а виды выдают их плоским списком. Отступ живёт на самой карточке, а в
   колонках его снимает грид — там расстояние задаёт gap. */
.card{margin-bottom:12px}
.kpis{margin-bottom:14px}
/* Компактная панель значков вместо трёх рядов поиск/фильтр/сортировка. */
.ctrlbar{display:flex;gap:8px;margin:6px 0 12px}
.ci{position:relative;width:40px;height:40px;border:0;border-radius:12px;
  background:var(--card);box-shadow:var(--shadow);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--dim)}
.ci .i{width:19px;height:19px}
.ci.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.ci .cimark{position:absolute;top:8px;right:8px;width:7px;height:7px;
  border-radius:50%;background:var(--accent)}
h2+.card,h2+.cards{margin-top:0}

.card{background:var(--card);border-radius:20px;padding:15px;
  box-shadow:var(--shadow);cursor:pointer}
.card.flat{cursor:default}
.card.accent{background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.card.danger{background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.name{font-weight:700;overflow-wrap:anywhere}
.meta{color:var(--dim);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.meta.when{white-space:nowrap;flex-shrink:0;margin-top:0}
.money{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;
  vertical-align:middle;flex-shrink:0}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.dot.warn{background:var(--warn)} .dot.off{background:var(--dim)}
.status{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;
  font-weight:700}
.status.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:#12a67e}
.status.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:#e0304a}
.status.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:#d9791a}
.status.off{background:color-mix(in srgb,var(--dim) 16%,transparent);color:var(--dim)}

.note{border-radius:16px;padding:13px 15px;font-size:13px;
  background:color-mix(in srgb,var(--warn) 12%,var(--card));box-shadow:var(--shadow)}
.note.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.note.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card))}
code{background:color-mix(in srgb,var(--fg) 7%,transparent);padding:2px 6px;
  border-radius:6px;font-size:12px;overflow-wrap:anywhere}

.bars{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.bar{position:relative;padding:9px 12px;border-radius:12px;overflow:hidden;
  background:var(--card);box-shadow:var(--shadow)}
.bar .fill{position:absolute;inset:0;background:var(--accent);opacity:.14}
.bar .txt{position:relative;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bar .txt b{font-variant-numeric:tabular-nums;font-weight:700}

.creative{display:flex;gap:12px;align-items:flex-start}
.creative img{width:64px;height:64px;border-radius:14px;object-fit:cover;flex-shrink:0;
  background:color-mix(in srgb,var(--fg) 6%,transparent)}
.creative .body{color:var(--dim);font-size:13px;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a{color:var(--accent);text-decoration:none;font-size:13px;font-weight:600;
  background:color-mix(in srgb,var(--accent) 10%,transparent);
  padding:6px 12px;border-radius:999px}

textarea,input.text,select.text{width:100%;padding:12px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);
  font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
textarea{min-height:92px}
button.act{width:100%;padding:14px;border-radius:16px;border:0;margin-top:10px;
  background:var(--grad-purple);color:#fff;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(124,108,255,.3)}
button.act[disabled]{opacity:.55}
button.act.ghost{background:var(--card);color:var(--fg);
  border:1px solid var(--line);box-shadow:var(--shadow)}
label.f{display:block;color:var(--dim);font-size:12px;margin:12px 0 6px;
  text-transform:uppercase;letter-spacing:.05em;font-weight:600}

svg.chart{width:100%;height:64px;display:block}
.spark{width:100%;height:52px;display:block;margin-top:6px}
.empty{color:var(--dim);text-align:center;padding:30px 12px;font-size:14px}
.back{color:var(--accent);cursor:pointer;font-size:14px;margin-bottom:10px;
  display:inline-block;font-weight:600}
.more{text-align:center;color:var(--accent);cursor:pointer;padding:13px;
  font-size:14px;font-weight:600}
.count{color:var(--dim);font-size:12px;margin:2px 0 10px}
.search{width:100%;padding:12px 14px;border-radius:14px;margin:6px 0;
  border:1px solid var(--line);background:var(--card);color:var(--fg);
  font-size:14px;font-family:inherit;box-shadow:var(--shadow)}

/* Нижний таб-бар */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);z-index:20}
.tabbar button{flex:1;background:none;border:0;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);
  font-size:10px;font-weight:600;padding:2px}
.tabbar button .ic{font-size:20px;line-height:1}
.tabbar button.on{color:var(--accent)}

/* --- Портал: широкий экран ------------------------------------------------
   Те же данные и тот же API, другая раскладка. Ниже 900px всё остаётся как
   было — телефон и Mini App вёрстку не замечают. Отдельной страницы для
   портала нет намеренно: две вёрстки одного и того же неизбежно разъезжаются,
   и расхождение замечают не сразу. */
@media (min-width: 900px){
  body{padding-bottom:0;padding-left:230px}
  .wrap{max-width:1180px;padding:26px 32px}
  h1{font-size:26px}

  /* Таб-бар превращается в боковое меню — та же разметка, другие правила. */
  .tabbar{top:0;bottom:0;right:auto;width:230px;flex-direction:column;
    justify-content:flex-start;gap:4px;padding:22px 14px;
    border-top:0;border-right:1px solid var(--line)}
  .tabbar::before{content:"Admetrics";display:block;font-weight:800;
    font-size:17px;color:var(--fg);padding:0 12px 18px;letter-spacing:-.2px}
  .tabbar button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;
    gap:12px;font-size:14px;padding:11px 12px;border-radius:11px;width:100%}
  .tabbar button .ic{font-size:17px;width:22px;text-align:center}
  .tabbar button:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .tabbar button.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}

  /* Карточки в несколько колонок. Группирует их groupCards() после отрисовки:
     виды выдают карточки плоским списком, и оборачивать каждый вручную
     значило бы править их все и не забыть про будущие. */
  .cards{display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
  .cards>.card{margin-bottom:0}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  /* Одинокая плитка не должна жаться к левому краю на широком экране. */
  .kpis:has(> :only-child){grid-template-columns:1fr}
  .kpi.hero{padding:22px 24px}
  .kpi.hero .v{font-size:34px}

  /* Формы и блоки ввода в решётке растягиваться не должны — они читаются
     колонкой, а поля ввода шириной в треть экрана неудобны. */
  .cards .card:has(textarea), .cards .card:has(input.text){grid-column:1 / -1}
}
@media (min-width: 1500px){
  .tabbar{width:250px}
  body{padding-left:250px}
  .wrap{max-width:1360px}
}
.signout{margin-top:auto;color:var(--dim) !important}
@media (max-width: 899px){ .signout{display:none} }
.auth{display:flex;align-items:center;gap:14px;margin:6px 0}
.auth-code{font-size:30px;font-weight:800;letter-spacing:3px;
  font-variant-numeric:tabular-nums;color:var(--accent)}
.auth-ring{position:relative;width:40px;height:40px;flex-shrink:0}
.auth-ring svg{width:40px;height:40px}
.auth-ring span{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;color:var(--dim)}

/* Дерево кампаний. Отступ и линия слева — единственный способ показать
   вложенность так, чтобы её не приходилось держать в голове. */
.kids{margin-left:6px;padding-left:12px;border-left:2px solid rgba(90,80,200,.18)}
.kids>.card{margin-bottom:8px}
.nodehead{cursor:pointer;user-select:none;align-items:center}
.chev{display:inline-block;width:14px;color:#6b64c9;font-size:11px;
      transition:transform .12s ease}
.chev.open{transform:rotate(90deg)}
.lvl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;
     color:#8a86a8;margin-right:6px}

/* Сворачиваемый раздел. Длинный журнал изменений нужен не всегда, а место
   занимает больше, чем всё остальное на экране вместе взятое. */
.fold{margin-bottom:12px}
.fold>summary{list-style:none;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:8px;padding:10px 2px;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a86a8}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .chev{color:#8a86a8}
.fold[open]>summary .chev{transform:rotate(90deg)}
.fold>summary .cnt{text-transform:none;letter-spacing:0;color:#a8a4bd}

/* Группы по маркетологам в админке. Свёрнуты по умолчанию: у админа сотни
   кабинетов/платежей, и плоский список — это стена. Заголовок несёт итог,
   тап раскрывает содержимое. Нативный <details>, без своего состояния. */
.mgroup{margin-bottom:8px;border:1px solid rgba(90,80,200,.14);
  border-radius:12px;overflow:hidden;background:rgba(90,80,200,.03)}
.mgroup>summary{list-style:none;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:8px;padding:12px 14px}
.mgroup>summary::-webkit-details-marker{display:none}
.mgroup>summary .mgchev{color:#8a86a8;transition:transform .15s;flex:0 0 auto}
.mgroup[open]>summary .mgchev{transform:rotate(90deg)}
.mgroup>summary .mgname{font-weight:600;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgroup>summary .mgsum{color:#a8a4bd;font-size:13px;flex:0 0 auto;text-align:right}
.mgroup>.kids{margin:0;padding:4px 10px 10px;border-left:none}
.mgroup>.kids>.card{margin-bottom:8px}

/* Ссылка на лендинг. Переносим по любому символу: адреса с макросами
   длинные, и обрезать их нельзя — по хвосту как раз и ищут клик в трекере. */
.url{color:#5a50c8;text-decoration:none;word-break:break-all;line-height:1.35}
.url:hover{text-decoration:underline}
</style>
</head>
<body>
<!-- Спрайт иконок: обводка, 24×24, currentColor — размер и цвет задаёт текст
     рядом. Лежит в документе один раз, дальше везде <use href="#i-имя">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-4.5v-6.5h-7V21H4a1 1 0 0 1-1-1z"/></symbol>
