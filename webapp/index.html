<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const PERIODS = [["today","Сегодня"],["7d","7 дней"],["30d","30 дней"],
                 ["all","За всё время"]];
const PAGE = 25;
const state = {tab:"home", period:"today", act:null, ident:null, mk:null,
               q:"", filter:"all", sort:"spend", limit:PAGE, role:null,
               // Карты и BM: своя пагинация и свои фильтры — платежей
               // пятнадцать тысяч, и общий `limit` для них не годится.
               cardsPage:0, cardTeam:"", cardState:"", cardId:"", cardMk:"",
               bm:null,
               // Выбранная кампания внутри карточки кабинета. Пустая строка —
               // «весь кабинет»: переключение идёт на месте, без ухода на
               // отдельный экран, потому что сравнивают именно с кабинетом.
               camp:"",
               // Вкладка креативов: «только те, у кого есть живое объявление».
               // По умолчанию выключено — сначала важно увидеть всё, что
               // потратило деньги, включая уже остановленное.
               creoLive:false,
               // Тронул ли человек период на экране карт вручную.
               cardsPeriodTouched:false,
               // Открыт ли режим «Свой период» (показывает поля дат).
               customOpen:false};
const app = document.getElementById("app");

// --- мелочи ------------------------------------------------------------- //
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (v, d=2) => (Number(v)||0).toLocaleString("ru-RU",
  {minimumFractionDigits:d, maximumFractionDigits:d});
const int = v => Math.round(Number(v)||0).toLocaleString("ru-RU");
const pct = v => (Number(v)||0).toFixed(2) + "%";
const dotOf = s => s === 1 ? "ok" : "bad";
// Иконка из спрайта. `tone` красит её в статусный цвет, не трогая цвет
// текста рядом: цветным должен быть значок, а не подпись.
const ic = (name, tone="") =>
  `<svg class="i${tone ? " " + tone : ""}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
// Точка состояния — там, где раньше стоял цветной кружок-эмодзи: он у каждой
// системы свой, а нужен ровно один, маленький и в цвете статуса.
const dot = kind => `<i class="dot ${kind}"></i>`;
const IDENT_WORDS = {ok:"живая", needs_reconnect:"нужен реконнект",
  disabled:"выключена", revoked:"секрет отозван", unknown:"ещё не проверена"};

// «Ещё не проверена» без пояснения читается как «про неё забыли». Поэтому
// рядом всегда либо причина неудачи, либо честное «ждёт ближайшего сбора».
function identWord(i) {
  const w = IDENT_WORDS[i.status] || i.status;
  if (i.status !== "unknown") return w;
  return i.last_error ? `${w} — проверить не вышло`
                      : `${w} · ждёт ближайшего сбора`;
}
const IDENT_KIND = {ok:"ok", needs_reconnect:"bad", disabled:"off",
  revoked:"off", unknown:"warn"};

function ago(stamp) {
  const t = Date.parse(stamp);
  if (!t) return "—";
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 90) return "только что";
  if (s < 3600) return `${Math.floor(s/60)} мин назад`;
  if (s < 86400) return `${Math.floor(s/3600)} ч назад`;
  return `${Math.floor(s/86400)} дн назад`;
}

async function api(path, params={}) {
  const q = new URLSearchParams({period: state.period, ...params});
  const r = await fetch(`${path}?${q}`, {
    headers: {"X-Telegram-Init-Data": tg?.initData || ""}
  });
  const data = await r.json().catch(() => ({error: "Сервер не ответил"}));
  if (!r.ok && !data.error) data.error = `Ошибка ${r.status}`;
  return data;
}

async function apiPost(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json",
              "X-Telegram-Init-Data": tg?.initData || ""},
    body: JSON.stringify(body)
  });
  return r.json().catch(() => ({error: "Сервер не ответил"}));
}

// Поле прокси: выбор из пула ИЛИ ввод нового. Новый уходит в пул и в
// следующий раз уже будет в списке — вводить повторно не нужно.
// Пул прокси держим в памяти: его спрашивают и форма добавления лички,
// и редактор прокси на каждой карточке. Ходить за одним и тем же списком
// по разу на карточку — лишние запросы на ровном месте.
let PROXY_POOL = [];
async function proxyPool(force) {
  if (!PROXY_POOL.length || force)
    PROXY_POOL = (await api("/api/proxies")).proxies || [];
  return PROXY_POOL;
}
function proxyOptions() {
  return PROXY_POOL.map(p =>
    `<option value="${esc(p.id)}">${esc(p.hint)}</option>`).join("");
}
// Через что личка ходит сейчас. Половина мёртвых личек мертвы из-за
// прокси, а до сих пор адрес нигде не показывался — «сменить» было
// действием вслепую.
function proxyLine(i) {
  return `<div class="meta">${ic("swap")}${i.proxy_hint ? esc(i.proxy_hint)
    : "без прокси — напрямую"}</div>`;
}
// Редактор прокси, свёрнутый до нажатия. Меняет ТОЛЬКО адрес: токен
// остаётся прежним, потому что переезд на другой IP его не отменяет.
function proxyEdit(i) {
  return `<div class="pxedit" data-pxedit="${esc(i.id)}" hidden>
    <select class="text" data-pxsel="${esc(i.id)}">
      <option value="">— выбрать из сохранённых —</option>
      ${proxyOptions()}
      <option value="__new__">+ ввести новый</option>
    </select>
    <input class="text" data-pxnew="${esc(i.id)}" hidden style="margin-top:6px"
      placeholder="socks5://user:pass@host:port" spellcheck="false">
    <div class="ctl">
      <button data-pxsave="${esc(i.id)}">${ic("check")}Сохранить прокси</button>
      <button data-pxclear="${esc(i.id)}">${ic("close")}Без прокси</button>
    </div>
    <div class="ctlnote" data-pxnote="${esc(i.id)}"></div>
  </div>`;
}

async function proxyField(sfx = "") {
  await proxyPool();
  const opts = proxyOptions();
  return `<label class="f">Прокси</label>
    <select class="text" id="proxySel${sfx}">
      <option value="">— выбрать из сохранённых —</option>
      ${opts}
      <option value="__new__">+ добавить новый</option>
    </select>
    <input class="text" id="proxyNew${sfx}" style="display:none;margin-top:6px"
      placeholder="socks5://user:pass@host:port" spellcheck="false">`;
}
function proxyWire(sfx = "") {
  const sel = document.getElementById("proxySel" + sfx);
  const inp = document.getElementById("proxyNew" + sfx);
  if (sel && inp) sel.addEventListener("change", () => {
    inp.style.display = sel.value === "__new__" ? "block" : "none";
  });
}
function proxyValue(sfx = "") {
  const sel = document.getElementById("proxySel" + sfx);
  const inp = document.getElementById("proxyNew" + sfx);
  if (!sel) return {};
  if (sel.value === "__new__") return {proxy: (inp?.value || "").trim()};
  return {proxy_id: sel.value};
}

// --- TOTP-аутентификатор (RFC 6238) ------------------------------------- //
// Поле 2FA из таблицы — это base32-секрет (ключ FB вида «D6NV KAVJ …»).
// Считаем текущий 6-значный код прямо в браузере через SubtleCrypto,
// секрет никуда не уходит. Так в аппке появляется свой аутентификатор.
function base32ToBytes(s) {
  const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  s = String(s).toUpperCase().replace(/[^A-Z2-7]/g, "");
  let bits = "", out = [];
  for (const c of s) bits += A.indexOf(c).toString(2).padStart(5, "0");
  for (let i = 0; i + 8 <= bits.length; i += 8)
    out.push(parseInt(bits.slice(i, i + 8), 2));
  return new Uint8Array(out);
}
function isTotpSecret(s) {
  const clean = String(s || "").toUpperCase().replace(/[^A-Z2-7]/g, "");
  return clean.length >= 16;
}
async function totpCode(secret, step = 30, digits = 6) {
  const key = base32ToBytes(secret);
  if (!key.length) return null;
  let counter = Math.floor(Date.now() / 1000 / step);
  const buf = new ArrayBuffer(8), view = new DataView(buf);
  view.setUint32(4, counter);
  const ck = await crypto.subtle.importKey("raw", key,
    {name: "HMAC", hash: "SHA-1"}, false, ["sign"]);
  const sig = new Uint8Array(await crypto.subtle.sign("HMAC", ck, buf));
  const off = sig[sig.length - 1] & 0xf;
  const bin = ((sig[off] & 0x7f) << 24) | (sig[off+1] << 16) |
              (sig[off+2] << 8) | sig[off+3];
  return String(bin % 10 ** digits).padStart(digits, "0");
}
// Запустить живой виджет в элементе: код + кольцо отсчёта, обновление раз в сек.
function mountAuthenticator(el, secret) {
  let timer;
  async function tick() {
    const code = await totpCode(secret);
    if (!code) { el.innerHTML = `<div class="meta">2FA-секрет не распознан</div>`; return; }
    const left = 30 - (Math.floor(Date.now()/1000) % 30);
    const pct = (left / 30) * 100;
    el.innerHTML = `<div class="auth" data-code="${code}">
      <div class="auth-code">${code.slice(0,3)} ${code.slice(3)}</div>
      <div class="auth-ring"><svg viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="16" fill="none" stroke="var(--line)" stroke-width="3"/>
        <circle cx="18" cy="18" r="16" fill="none" stroke="var(--accent)" stroke-width="3"
          stroke-dasharray="${pct} 100" stroke-linecap="round"
          transform="rotate(-90 18 18)"/></svg><span>${left}</span></div></div>
      <div class="meta">нажмите, чтобы скопировать</div>`;
    el.querySelector(".auth")?.addEventListener("click", () => {
      navigator.clipboard?.writeText(code);
      tg?.HapticFeedback?.notificationOccurred?.("success");
    });
  }
  tick(); timer = setInterval(tick, 1000);
  return () => clearInterval(timer);
}

// Свой период задаётся строкой «с..по» — она же уходит в API как есть,
// поэтому её видно в адресе и можно переслать коллеге.
const isRange = v => /^\d{4}-\d{2}-\d{2}\.\.\d{4}-\d{2}-\d{2}$/.test(v || "");

// Человеческое имя текущего периода. Нужно там, где чипов рядом нет, а
// сказать, за что именно будет выгрузка, обязательно: «скачал не то»
// выясняется уже в таблице.
function periodWord() {
  const known = PERIODS.find(([c]) => c === state.period);
  if (known) return known[1].toLowerCase();
  const [from, to] = String(state.period || "").split("..");
  return from && to ? rangeWord(from, to) : String(state.period || "");
}

function periodChips() {
  const custom = isRange(state.period);
  const open = custom || state.customOpen;   // поля видны только в этом режиме
  const [from, to] = custom ? state.period.split("..") : ["", ""];
  return `<div class="chips">` + PERIODS.map(([code, label]) =>
    `<button class="chip ${!open && code === state.period ? "on" : ""}"
      data-period="${code}">${label}</button>`).join("") +
    `<button class="chip ${open ? "on" : ""}" data-rangetoggle="1">${
      custom ? esc(rangeWord(from, to)) : "Свой период"}</button></div>` +
    `<div class="chips range" id="rangeBox" ${open ? "" : "hidden"}>
       <input class="text day" type="date" id="rFrom" value="${esc(from)}"
         max="${todayISO()}" aria-label="с">
       <span class="lab">—</span>
       <input class="text day" type="date" id="rTo" value="${esc(to)}"
         max="${todayISO()}" aria-label="по">
       <button class="chip go" data-rangeapply="1">Показать</button>
     </div>`;
}

const todayISO = () => new Date().toISOString().slice(0, 10);

function rangeWord(from, to) {
  const f = d => new Date(d + "T00:00:00").toLocaleDateString("ru-RU",
    {day: "numeric", month: "short"});
  return from === to ? f(from) : `${f(from)} — ${f(to)}`;
}

// Поиск, фильтры и сортировка — то, без чего список из десятков строк
// становится бесполезным: нужное в нём просто не найти.
function listControls(filters, sorts) {
  // Компактная панель значков: поиск, фильтр, сортировка. Разворачивается
  // только нужное — экран не занят тремя рядами управления по умолчанию.
  const open = state.ctrlOpen || "";
  const hasF = filters && filters.length, hasS = sorts && sorts.length;
  // Точка-маркер на значке, если фильтр/сортировка не в значении по умолчанию.
  const fActive = state.filter && state.filter !== "all";
  const sActive = state.sort && state.sort !== (sorts && sorts[0] && sorts[0][0]);
  const bar = `<div class="ctrlbar">
    <button class="ci ${open === "search" ? "on" : ""}" data-ctrl="search"
      aria-label="Поиск">${ic("search")}${state.q ? `<i class="cimark"></i>` : ""}</button>
    ${hasF ? `<button class="ci ${open === "filter" ? "on" : ""}" data-ctrl="filter"
      aria-label="Фильтр">${ic("filter")}${fActive ? `<i class="cimark"></i>` : ""}</button>` : ""}
    ${hasS ? `<button class="ci ${open === "sort" ? "on" : ""}" data-ctrl="sort"
      aria-label="Сортировка">${ic("sort")}${sActive ? `<i class="cimark"></i>` : ""}</button>` : ""}
  </div>`;
  const search = open === "search"
    ? `<input class="search" id="q" placeholder="Поиск по названию…"
        value="${esc(state.q)}" autocomplete="off">` : "";
  const filt = open === "filter" && hasF ? `<div class="chips">
      ${filters.map(([code, label]) => `<button class="chip sm
        ${state.filter === code ? "on" : ""}" data-filter="${code}">${label}</button>`).join("")}
    </div>` : "";
  const srt = open === "sort" && hasS ? `<div class="chips">
      ${sorts.map(([code, label]) => `<button class="chip sm
        ${state.sort === code ? "on" : ""}" data-sort="${code}">${label}</button>`).join("")}
    </div>` : "";
  return bar + search + filt + srt;
}

function applyList(items, nameOf) {
  const q = state.q.trim().toLowerCase();
  let out = q ? items.filter(i => nameOf(i).toLowerCase().includes(q)) : items;
  const total = out.length;
  return {shown: out.slice(0, state.limit), total};
}

// Свёрнутые группы по маркетологам. items — уже отфильтрованный список;
// keyOf(item)->id маркетолога; labelOf(list)->подпись группы; sumOf(list)->
// правый текст заголовка (итог); cardOf(item)->html карточки. Свёрнуто по
// умолчанию (нативный <details> без атрибута open).
// Аватарка из Telegram: кружок-градиент как заглушка, поверх — фото. Нет
// фото / закрыта приватность / 404 — <img> убирает себя, остаётся кружок.
function avatar(src) {
  return `<span class="tgav">${src
    ? `<img src="${src}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
}

function mgroups(items, {keyOf, labelOf, sumOf, cardOf, noOwner = "Без маркетолога"}) {
  const groups = new Map();
  for (const it of items) {
    const k = keyOf(it) || "";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  }
  // Порядок групп — по убыванию размера: у кого больше, тот выше.
  const entries = [...groups.entries()].sort((a, b) => b[1].length - a[1].length);
  return entries.map(([k, list]) => `
    <details class="mgroup">
      <summary>
        <span class="mgchev">▶</span>
        ${k ? avatar(`/api/avatar/m/${encodeURIComponent(k)}`) : ""}
        <span class="mgname">${k ? esc(labelOf(list)) : esc(noOwner)}</span>
        <span class="mgsum">${esc(sumOf(list))}</span>
      </summary>
      <div class="kids">${list.map(cardOf).join("")}</div>
    </details>`).join("");
}

function moreBtn(shown, total) {
  if (shown >= total) return "";
  return `<div class="more" data-more="1">Показать ещё
    ${Math.min(PAGE, total - shown)} из ${total - shown}</div>`;
}

// --- график по дням ------------------------------------------------------ //
// Рисуется ПОСЛЕ вставки в документ: ширину контейнера до этого никто не
// знает, а без неё нельзя ни выбрать шаг подписей, ни удержать размер шрифта.
// Поэтому вид оставляет пустой ящик с идентификатором, данные кладутся сюда,
// а `drawCharts` превращает их в SVG — вместе с осями и подсказкой.
const CHARTS = new Map();
let chartSeq = 0;

function chartBox(rows, opts = {}) {
  if (!rows || !rows.length) return "";
  const id = "ch" + (++chartSeq);
  CHARTS.set(id, {rows, opts});
  return `<div class="chartbox" id="${id}"></div>`;
}

// Шкала «красивыми» числами: 0 · 2,5 · 5 читается, 0 · 2,37 · 4,74 — нет.
function niceStep(span, want = 4) {
  const raw = span / want;
  const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const norm = raw / mag;
  return (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
}

const shortNum = v => Math.abs(v) >= 1000
  ? (v / 1000).toLocaleString("ru-RU", {maximumFractionDigits: 1}) + "k"
  : Number(v).toLocaleString("ru-RU", {maximumFractionDigits: 2});

const dayLabel = iso => {
  const d = new Date(iso + "T00:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("ru-RU", {day:"numeric", month:"short"});
};

function drawCharts(root) {
  root.querySelectorAll(".chartbox").forEach(box => {
    const spec = CHARTS.get(box.id);
    if (!spec) return;
    const {rows, opts} = spec;
    const key = opts.key || "spend";
    const unit = opts.unit || "";
    const vals = rows.map(r => Number(r[key]) || 0);
    const W = Math.max(260, box.clientWidth || 320);
    const H = opts.height || 190;
    // Поля под подписи. Левое считается по самой длинной подписи оси —
    // фиксированное либо режет «12 345», либо съедает треть узкого экрана.
    const top = 18, bottom = 26;
    const maxV = Math.max(...vals, 0);
    const step = niceStep(maxV || 1);
    const ceil = Math.max(step, Math.ceil((maxV || 1) / step) * step);
    const ticks = [];
    for (let v = 0; v <= ceil + 1e-9; v += step) ticks.push(v);
    const left = Math.max(30, 7.2 * Math.max(...ticks.map(t => shortNum(t).length)) + 10);
    const right = 8;
    const plotW = W - left - right, plotH = H - top - bottom;
    const y = v => top + plotH - (v / (ceil || 1)) * plotH;

    // Ось X — по РЕАЛЬНОЙ дате, а не по индексу: иначе разрыв в сборе
    // (например семь месяцев между двумя точками) выглядит так же узко,
    // как соседние дни, и тренд врёт. Точки стоят пропорционально времени.
    const tAt = i => { const t = Date.parse(rows[i].date); return isNaN(t) ? i : t; };
    const t0 = tAt(0), t1 = tAt(rows.length - 1);
    const span = (t1 - t0) || 1;
    const pad = rows.length > 1 ? plotW * 0.02 : 0;
    const xs = rows.map((r, i) => rows.length === 1
      ? left + plotW / 2
      : left + pad + (tAt(i) - t0) / span * (plotW - 2 * pad));
    const x = i => xs[i];
    let minGap = plotW;
    for (let i = 1; i < xs.length; i++) minGap = Math.min(minGap, xs[i] - xs[i - 1]);
    // Форма. До полутора десятков дней столбики честнее: каждый день —
    // отдельная величина. Дальше — линия, она читается лучше на длинном ряду.
    const asBars = rows.length <= 14;

    const grid = ticks.map(v => `
      <line class="gl" x1="${left}" x2="${W - right}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="ax" x="${left - 8}" y="${y(v) + 3.5}" text-anchor="end">${shortNum(v)}</text>
    `).join("");

    // Подписи дат: точки теперь неравномерны по X, поэтому прореживаем не по
    // индексу, а по пиксельному расстоянию — жадно, не ближе 62px друг к другу.
    // Крайние подписи привязываем к краю, иначе центрированная у левой оси
    // дата обрезается («·02» вместо «10-02»).
    const anchorAt = px => px < left + 26 ? "start"
      : px > W - right - 26 ? "end" : "middle";
    let lastLabX = -1e9;
    const xlab = rows.map((r, i) => {
      const px = x(i), last = i === rows.length - 1;
      if (!last && px - lastLabX < 62) return "";
      lastLabX = px;
      return `<text class="ax" x="${px}" y="${H - 8}" text-anchor="${anchorAt(px)}">${dayLabel(r.date)}</text>`;
    }).join("");

    let marks = "";
    if (asBars) {
      const bw = Math.min(46, Math.max(3, minGap * 0.7));
      marks = rows.map((r, i) => {
        const v = Number(r[key]) || 0;
        const h = Math.max(v > 0 ? 3 : 0, top + plotH - y(v));
        return `<rect x="${x(i) - bw / 2}" y="${y(v)}" width="${bw}" height="${h}"
          rx="4" fill="var(--accent)" opacity="${v ? .92 : .18}"/>`;
      }).join("");
    } else {
      const d = rows.map((r, i) => `${i ? "L" : "M"} ${x(i)} ${y(Number(r[key]) || 0)}`).join(" ");
      const area = `${d} L ${x(rows.length - 1)} ${top + plotH} L ${x(0)} ${top + plotH} Z`;
      marks = `<path d="${area}" fill="var(--accent)" opacity=".10"/>
        <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>`;
    }

    // Числа подписываем выборочно: у столбиков все (их мало и они для того
    // и выбраны), у линии — только максимум и последний день. Число на
    // каждой точке линии превращает график в таблицу, набранную по кривой.
    let vlabs = "";
    if (asBars && minGap > 34) {
      vlabs = rows.map((r, i) => {
        const v = Number(r[key]) || 0;
        return v ? `<text class="vl" x="${x(i)}" y="${y(v) - 6}"
          text-anchor="middle">${shortNum(v)}</text>` : "";
      }).join("");
    } else if (!asBars) {
      const iMax = vals.indexOf(Math.max(...vals));
      vlabs = [iMax, rows.length - 1].filter((v, i, a) => a.indexOf(v) === i)
        .map(i => `<circle cx="${x(i)}" cy="${y(vals[i])}" r="4"
            fill="var(--card)" stroke="var(--accent)" stroke-width="2.5"/>
          <text class="vl" x="${x(i)}" y="${y(vals[i]) - 10}"
            text-anchor="${i === rows.length - 1 ? "end" : "middle"}">${shortNum(vals[i])}</text>`)
        .join("");
    }

    const hits = rows.map((r, i) => {
      const xl = i === 0 ? left : (xs[i - 1] + xs[i]) / 2;
      const xr = i === rows.length - 1 ? (W - right) : (xs[i] + xs[i + 1]) / 2;
      return `<rect class="hit" data-i="${i}" x="${xl}" y="${top}"
        width="${Math.max(1, xr - xl)}" height="${plotH}"/>`;
    }).join("");

    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}"
        preserveAspectRatio="xMidYMid meet">
      ${grid}${marks}${vlabs}${xlab}
      <line class="gl" x1="${left}" x2="${left}" y1="${top}" y2="${top + plotH}"/>
      <g class="cursor" opacity="0"><line x1="0" x2="0" y1="${top}" y2="${top + plotH}"
        stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3"/></g>
      ${hits}
    </svg><div class="tip"></div>`;

    // Подсказка. График на экране — интерактивный по умолчанию: точное
    // значение спрашивают у конкретного дня, а не читают с глазомера.
    const tip = box.querySelector(".tip");
    const cursor = box.querySelector(".cursor line");
    const scale = () => (box.clientWidth || W) / W;
    box.querySelectorAll(".hit").forEach(hit => {
      const i = Number(hit.dataset.i);
      const show = () => {
        const r = rows[i], v = Number(r[key]) || 0;
        tip.innerHTML = `<b>${money(v)} ${esc(unit)}</b>${dayLabel(r.date)}${
          r.impressions !== undefined ? ` · показы ${int(r.impressions)}` : ""}${
          r.clicks !== undefined ? ` · клики ${int(r.clicks)}` : ""}`;
        tip.style.left = (x(i) * scale()) + "px";
        tip.style.top = (y(v) * scale()) + "px";
        tip.style.opacity = 1;
        cursor.setAttribute("x1", x(i)); cursor.setAttribute("x2", x(i));
        cursor.parentNode.setAttribute("opacity", 1);
      };
      hit.addEventListener("mouseenter", show);
      hit.addEventListener("touchstart", show, {passive: true});
    });
    box.addEventListener("mouseleave", () => {
      tip.style.opacity = 0;
      box.querySelector(".cursor").setAttribute("opacity", 0);
    });
  });
  CHARTS.clear();
}

function sparkline(rows, key="spend", stroke="var(--accent)") {
  if (!rows || rows.length < 2) return "";
  const vals = rows.map(r => Number(r[key]) || 0);
  const max = Math.max(...vals, 0.0001), min = Math.min(...vals, 0);
  const W = 300, H = 48, n = rows.length;
  const x = i => (i / (n - 1)) * W;
  const y = v => H - 6 - ((v - min) / (max - min || 1)) * (H - 12);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  // сглаженная линия через среднюю точку между узлами
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [px,py]=pts[i-1], [cx,cy]=pts[i];
    d += ` Q ${px} ${py} ${(px+cx)/2} ${(py+cy)/2}`;
  }
  d += ` T ${pts[pts.length-1][0]} ${pts[pts.length-1][1]}`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function chart(rows, key="spend") {
  if (!rows || rows.length < 2) return "";
  const vals = rows.map(r => Number(r[key]) || 0);
  const max = Math.max(...vals, 0.0001);
  const W = 300, H = 100, gap = 3;
  const bw = (W - gap * (rows.length - 1)) / rows.length;
  const bars = rows.map((r, i) => {
    const h = Math.max(2, (Number(r[key]) || 0) / max * (H - 22));
    const x = i * (bw + gap);
    return `<rect x="${x.toFixed(1)}" y="${(H - 16 - h).toFixed(1)}"
      width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"
      fill="var(--btn)" opacity=".75"></rect>`;
  }).join("");
  const labels = rows.map((r, i) => {
    if (rows.length > 10 && i % Math.ceil(rows.length / 7)) return "";
    const x = i * (bw + gap) + bw / 2;
    return `<text x="${x.toFixed(1)}" y="${H - 3}" font-size="8"
      fill="var(--dim)" text-anchor="middle">${esc(String(r.date).slice(5))}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${bars}${labels}</svg>`;
}

function bars(rows, currency) {
  if (!rows?.length) return "";
  const total = rows.reduce((s, r) => s + (Number(r.spend) || 0), 0) || 1;
  return `<div class="bars">` + rows.slice(0, 8).map(r => {
    const share = (Number(r.spend) || 0) / total * 100;
    const name = {female:"женщины", male:"мужчины", unknown:"не указан"}[r.value] || r.value;
    return `<div class="bar"><div class="fill" style="width:${share.toFixed(1)}%"></div>
      <div class="txt"><span>${esc(name)}</span>
      <b>${money(r.spend)} ${esc(currency||"")} · ${share.toFixed(0)}%</b></div></div>`;
  }).join("") + `</div>`;
}

function noteRates(d) {
  if (!Number(d.unconverted)) return "";
  return `<div class="note">Не переведено ${money(d.unconverted)} — нет курса
    ${esc((d.missing_rates||[]).join(", "))} → ${esc(d.base_currency)}.
    Эта сумма не в итоге.<br>
    <code>python3 manage.py fx set ${new Date().toISOString().slice(0,10)}
    ${esc(d.missing_rates?.[0] || "USD")} 80</code></div>`;
}

// --- ближайшее списание -------------------------------------------------- //
function nextCharge(charges) {
  if (!charges || !charges.length) return "";
  const c = charges[0];
  const when = new Date(c.when).toLocaleDateString("ru-RU",
    {day:"numeric", month:"short"});
  const soon = c.days_left != null && c.days_left <= 2;
  const rest = charges.slice(1, 4).map(x =>
    `<div class="meta">${esc(x.name)} — ~${money(x.amount)} ${esc(x.currency)}
      · ${x.days_left} дн (${new Date(x.when).toLocaleDateString("ru-RU",
      {day:"numeric",month:"short"})})</div>`).join("");
  return `<div class="card accent" data-act="${esc(c.act_id)}">
    <div class="row"><span class="name">${ic("card")}Спишут ~${money(c.amount)} ${esc(c.currency)}</span>
      <span class="money">${c.days_left != null ? c.days_left + " дн" : ""}</span></div>
    <div class="meta">${esc(c.name)} · ${when} · ${esc(c.rule)}${
      charges.length > 1 ? ` · и ещё ${charges.length-1}` : ""}</div>
    ${rest}</div>`;
}

// --- сводка -------------------------------------------------------------- //
function payLine(d) {
  const pay = d.pay || {};
  const cards = Number(pay.cards_charged) || 0;
  const fb = Number(pay.fb_billed) || 0;
  if (!cards && !fb) return "";     // нечего показывать — не мозолим глаза
  const cc = esc(pay.cards_currency || "");
  const fc = esc(pay.fb_currency || "");
  // Две цифры рядом: сколько ушло с карт и сколько FB предъявил по кабинетам.
  // Список отдельных транзакций убран — здесь итог за период, и только он.
  return `<div class="card flat"><div class="l" style="color:var(--dim);
      font-size:12px;margin-bottom:6px">Платежи · ${esc(d.period_label)}</div>
    <div class="row"><span class="name">Оплачено картами</span>
      <span class="money">${money(cards)} ${cc}</span></div>
    <div class="row"><span class="name">Кабинеты списали</span>
      <span class="money">${money(fb)} ${fc}</span></div></div>`;
}

async function viewHome() {
  const d = await api("/api/summary");
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);
  state.role = d.role;
  const admin = d.role === "admin";

  const problems = [];
  if (d.accounts_broken) problems.push(`<div class="card danger"
    data-go="accounts" data-preset="broken"><div class="row">
    <span class="name">${ic("ban","bad")}Аккаунты забанены / с проблемой</span>
    <span class="money">${d.accounts_broken}</span></div>
    <div class="meta">нажмите, чтобы разобрать</div></div>`);
  if (d.accounts_no_access) problems.push(`<div class="card danger"
    data-go="accounts" data-preset="noaccess"><div class="row">
    <span class="name">${ic("key","warn")}Нет доступа — переподключить токен</span>
    <span class="money">${d.accounts_no_access}</span></div>
    <div class="meta">нажмите, чтобы переподключить</div></div>`);

  const alerts = (d.alerts || []).slice(0, 5).map(a =>
    `<div class="card flat"><div class="row"><span class="name">
      ${dot({bad:"bad",warn:"warn",info:"info"}[a.severity] || "off")}${esc(a.title)}</span>
      <span class="meta">${esc(ago(a.created_at))}</span></div>
      ${a.body ? `<div class="meta">${esc(a.body)}</div>` : ""}</div>`).join("");

  // На главной — только свежие события (<48ч). Старые «личка отвалилась»
  // при уже живой личке — это лог, а не текущее состояние, ему не место
  // в сводке «что сейчас».
  const fresh = (d.alerts || []).filter(a => {
    const t = Date.parse(a.created_at);
    return t && (Date.now() - t) < 48 * 3600 * 1000;
  }).slice(0, 4);
  const events = fresh.map(a =>
    `<div class="card flat"><div class="row">
      <span class="name">${dot({bad:"bad",warn:"warn",info:"info"}[a.severity]||"off")}${esc(a.title)}</span>
      <span class="meta when">${esc(ago(a.created_at))}</span></div>
      ${a.body ? `<div class="meta">${esc(a.body)}</div>` : ""}</div>`).join("");

  render(`
    <div class="head"><div class="avatar">${d.tg_id
      ? `<img src="/api/avatar/tg/${encodeURIComponent(d.tg_id)}" alt=""
          onerror="this.remove()">` : ""}<span class="live"></span></div>
      <div><div class="who">${esc(d.name)}</div>
      <div class="sub" style="margin:0">${esc(d.cycle_label)} · сбор ${d.last_run ?
        esc(ago(d.last_run.started_at)) : "ни разу"}</div></div></div>
    ${periodChips()}
    <div class="stack">
      ${problems.join("")}
      ${noteRates(d)}
      <div class="kpis">
        <div class="kpi hero"><div class="l">Спенд · ${esc(d.period_label)}</div>
          <div class="v">${money(d.spend_base)} <span style="font-size:15px;opacity:.7">${esc(d.base_currency)}</span></div>
          ${Number(d.unconverted) ? `<div class="n">+${money(d.unconverted)} не переведено</div>` : ""}
        </div>
        <div class="kpi" data-go="accounts"><div class="l">Аккаунты</div>
          <div class="v">${d.accounts_total}</div>
          <div class="n">${(d.accounts_broken || d.accounts_no_access)
            ? `${ic("warn","bad")}${(d.accounts_broken||0)+(d.accounts_no_access||0)} требуют внимания`
            : "все в порядке"}</div></div>
      </div>
      ${payLine(d)}
      ${nextCharge(d.upcoming_charges)}
      ${admin ? `<button class="act ghost" id="collect">${ic("refresh")}Собрать сейчас</button>
        <div class="meta" id="collectNote"></div>` : ""}
      ${events ? `<h2>Сейчас важно</h2>${events}` : ""}
    </div>`);

  const btn = document.getElementById("collect");
  btn?.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "Запускаю…";
    const res = await apiPost("/api/collect", {});
    document.getElementById("collectNote").textContent =
      res.error || res.message || "";
    btn.innerHTML = ic("refresh") + "Собрать сейчас";
    btn.disabled = false;
  });
}

// --- кабинеты ------------------------------------------------------------ //
// Выгрузка «кампания Keitaro → ссылка → расход». CSV, потому что его
// открывает всё: и таблица, и импорт трекера, и человек глазами.
const EXPORT_COLS = [
  ["keitaro_id", "keitaro_id"], ["link", "link"], ["spend", "spend"],
];

function toCSV(rows, cols = EXPORT_COLS) {
  // Разделитель — точка с запятой: Excel с русской локалью иначе кладёт
  // всю строку в одну ячейку. Кавычки удваиваем по RFC, ссылки с запятыми
  // и макросами при этом остаются целыми.
  const esc2 = v => {
    const t = String(v === null || v === undefined ? "" : v);
    return /[";\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
  };
  const head = cols.map(c => c[1]).join(";");
  const body = rows.map(r => cols.map(c => esc2(r[c[0]])).join(";"));
  return "\uFEFF" + [head, ...body].join("\r\n");
}

async function exportLinks() {
  const note = document.getElementById("expNote");
  note.className = "ctlnote"; note.textContent = "Собираю…";
  const d = await api("/api/links/export");
  if (d.error) { note.className = "ctlnote bad"; note.textContent = d.error; return null; }
  if (!d.count) {
    note.className = "ctlnote";
    note.textContent = "Нечего выгружать: живых объявлений со связью нет.";
    return null;
  }
  note.className = "ctlnote ok";
  note.textContent = `Строк: ${d.count} · ${esc(d.period_label || "")}`;
  return d;
}

async function viewAccounts() {
  const d = await api("/api/accounts");
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);
  // Токены живут здесь же: кабинет и появляется из токена, и искать эту
  // форму маркетолог будет там, где смотрит на кабинеты, а не в отдельном
  // разделе. У админа заведение идёт через карточку человека — оттуда
  // видно, кому личка достанется.
  const tok = await api("/api/identities");
  const own = tok.role === "admin" ? "" : (tok.me || "");
  const mine = tok.identities || [];
  const pf = own ? await proxyField() : "";
  const pfBulk = own ? await proxyField("Bulk") : "";
  let items = d.accounts || [];
  if (state.filter === "broken") items = items.filter(a => a.account_status !== 1);
  if (state.filter === "noaccess") items = items.filter(a => a.token_status === "needs_reconnect");
  if (state.filter === "noowner") items = items.filter(a => !a.owner_name);
  if (state.filter === "spent") items = items.filter(a => Number(a.spend) > 0);
  if (state.sort === "name") items = [...items].sort((a, b) =>
    String(a.name||"").localeCompare(String(b.name||""), "ru"));
  if (state.sort === "status") items = [...items].sort((a, b) =>
    (a.account_status === 1) - (b.account_status === 1));

  const {shown, total} = applyList(items, a => `${a.name||""} ${a.act_id}`);
  const sum = shown.reduce((s, a) => s + (Number(a.spend)||0), 0);
  // Объединённый статус: бан кабинета важнее, затем мёртвый токен, иначе ок.
  const stOf = a => a.account_status !== 1 ? "bad"
    : a.token_status === "needs_reconnect" ? "warn" : "ok";
  const stWord = a => a.account_status !== 1 ? (a.disable_label || a.status_label || "проблема")
    : a.token_status === "needs_reconnect" ? "нет доступа — переподключить токен"
    : (a.status_label || "активен");
  // Карточка кабинета — сводка: имя+статус, спенд, и одна строка мета.
  // В группировке по маркетологам владельца в мете не дублируем (он в
  // заголовке группы). Детали — по тапу, на отдельном экране кабинета.
  const cardOf = a => `
    <div class="card" data-act="${esc(a.act_id)}">
      <div class="row">
        <span class="name"><i class="dot ${stOf(a)}"></i>${esc(a.name || a.act_id)}</span>
        <span class="money">${money(a.spend)} ${esc(a.currency || "")}</span>
      </div>
      <div class="meta">${esc(stWord(a))}${
        !admin && a.owner_name ? " · " + esc(a.owner_name) : ""}${
        Number(a.spend) ? ` · CTR ${pct(a.ctr)} · CPC ${money(a.cpc)}` : ""}
        · карта •${esc(a.funding_last4 || "—")}</div>
    </div>`;
  const admin = state.role === "admin";

  // Карточка лички-группы: имя сессии — заголовок, её кабинеты — внутри.
  // Токен и кабинеты — один объект в реальности, поэтому и на экране вместе.
  const tokenGroup = (i, accs) => {
    const spend = accs.reduce((s, a) => s + (Number(a.spend) || 0), 0);
    return `<details class="mgroup">
      <summary>
        <span class="mgchev">\u25b6</span>
        <span class="mgname"><i class="dot ${IDENT_KIND[i.status] || "off"}"></i>${
          esc(i.session_name || i.label || i.id)}</span>
        <span class="mgsum">${int(accs.length)} каб · ${money(spend)}</span>
      </summary>
      <div class="kids">
        <div class="card flat">
          <div class="meta">${esc(identWord(i))}</div>
          ${proxyLine(i)}
          ${i.last_error ? `<div class="meta">${ic("warn","bad")}${
            esc(String(i.last_error).slice(0, 110))}</div>` : ""}
          <div class="ctl">
            <button data-probe="${esc(i.id)}">${ic("radio")}Проверить доступ</button>
            <button data-pxopen="${esc(i.id)}">${ic("swap")}Сменить прокси</button>
            <button data-ident="${esc(i.id)}">${ic("external")}Открыть</button></div>
          <div class="ctlnote" data-probenote="${esc(i.id)}"></div>
          ${proxyEdit(i)}
        </div>
        ${accs.map(cardOf).join("") || `<div class="empty">Кабинетов у этой
          лички пока нет.</div>`}
      </div>
    </details>`;
  };
  const orphanGroup = (name, accs) => `<details class="mgroup">
    <summary><span class="mgchev">\u25b6</span>
      <span class="mgname">Без токена${name ? " · " + esc(name) : ""}</span>
      <span class="mgsum">${int(accs.length)} каб</span></summary>
    <div class="kids">${accs.map(cardOf).join("")}</div></details>`;

  let body, headCount = "";
  if (admin) {
    // Админ: маркетолог → кабинеты (токены живут в карточке человека).
    body = mgroups(shown, {
      keyOf: a => a.eff_marketer_id,
      labelOf: list => {
        const byAccess = list.every(a => a.owner_by_access);
        return (list[0].eff_owner_name || "") + (byAccess ? " · по доступу" : "");
      },
      sumOf: list => `${int(list.length)} каб · ${money(
        list.reduce((s, a) => s + (Number(a.spend) || 0), 0))}`,
      cardOf,
    });
    headCount = `<div class="count">показано ${shown.length} из ${total} ·
      сумма ${money(sum)}</div>`;
  } else {
    // Маркетолог: кабинеты сгруппированы под своей личкой по имени сессии.
    const byTok = new Map();
    for (const a of items) {
      const k = a.session_name || "";
      if (!byTok.has(k)) byTok.set(k, []);
      byTok.get(k).push(a);
    }
    const groups = mine.map(i => {
      const key = i.session_name || i.label || "";
      const accs = byTok.get(key) || [];
      byTok.delete(key);
      return tokenGroup(i, accs);
    });
    const orphan = [...byTok.entries()].filter(([, v]) => v.length)
      .map(([k, v]) => orphanGroup(k, v));
    body = groups.join("") + orphan.join("")
      || `<div class="empty">Токенов нет — добавьте ниже.</div>`;
  }

  render(`
    <h1>Аккаунты</h1><p class="sub">${esc(d.period_label)}</p>
    ${periodChips()}
    ${listControls([["all","Все"],["broken","Бан"],
                    ["noaccess","Нет доступа"],["noowner","Без владельца"],
                    ["spent","С открутом"]],
                   [["spend","спенд"],["name","имя"],["status","статус"]])}
    ${headCount}
    ${body}
    ${admin ? moreBtn(shown.length, total) : ""}
    ${own ? `
    <h2>Добавить токен</h2>
    <div class="card flat">
      <label class="f">Имя сессии (как в антике или таблице)</label>
      <input class="text" id="newName" placeholder="fm FB mf17_2163 12.08 AS">
      <label class="f">Мультитокен</label>
      <textarea id="newSecret" placeholder="eyJ0b2tlбiI6…" spellcheck="false"></textarea>
      ${pf}
      <button class="act" id="addIdent">Добавить</button>
      <div class="meta" id="addNote" style="margin-top:8px"></div>
      <div class="meta" style="margin-top:8px">Прокси задавайте тот, из которого
        работает сам профиль. Чужой адрес Meta читает как вход с другого
        устройства и гасит сессию за часы.</div>
    </div>` : ""}`);
  document.getElementById("expCsv")?.addEventListener("click", async () => {
    const d = await exportLinks();
    if (!d) return;
    const blob = new Blob([toCSV(d.rows)], {type: "text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `admetrics-keitaro-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
  document.getElementById("expCopy")?.addEventListener("click", async () => {
    const d = await exportLinks();
    if (!d) return;
    const note = document.getElementById("expNote");
    try {
      await navigator.clipboard.writeText(toCSV(d.rows));
      note.className = "ctlnote ok";
      note.textContent = `Скопировано строк: ${d.count} — вставляйте в таблицу.`;
    } catch (e) {
      // В Mini App буфер бывает закрыт. Тогда показываем текст: выделить
      // и скопировать руками всё равно быстрее, чем остаться ни с чем.
      note.className = "ctlnote";
      note.innerHTML = `<textarea class="text" style="min-height:120px"
        onclick="this.select()">${esc(toCSV(d.rows))}</textarea>`;
    }
  });
  if (!own) return;
  proxyWire(); proxyWire("Bulk");
  document.getElementById("addIdent")?.addEventListener("click", async () => {
    const secret = document.getElementById("newSecret").value.trim();
    const note = document.getElementById("addNote");
    if (!secret) { note.textContent = "Вставьте токен."; return; }
    note.textContent = "Добавляю…";
    const res = await apiPost("/api/identity/add", {
      marketer_id: own, secret,
      session_name: document.getElementById("newName").value.trim(),
      ...proxyValue()});
    note.textContent = res.error || res.message;
    if (!res.error) {
      document.getElementById("newSecret").value = "";
      tg?.HapticFeedback?.notificationOccurred?.("success");
      setTimeout(() => show("accounts"), 900);
    }
  });
  document.getElementById("addBulk")?.addEventListener("click", async () => {
    const text = document.getElementById("bulkText").value;
    const note = document.getElementById("bulkAddNote");
    if (!text.trim()) { note.textContent = "Вставьте токены."; return; }
    note.textContent = "Добавляю…";
    const res = await apiPost("/api/identity/add_bulk",
      {marketer_id: own, text, ...proxyValue("Bulk")});
    note.textContent = res.error || res.message;
    if (!res.error) {
      document.getElementById("bulkText").value = "";
      setTimeout(() => show("accounts"), 900);
    }
  });
}

// Карточка данных восстановления. Одна на два места: карточку кабинета
// и картотеку — чтобы «что показываем и как подписываем» не разъезжалось.
function recoveryCard(rec, session) {
  const s = rec.secret || {};
  const line = (label, val) => val
    ? `<div class="meta"><b>${label}:</b> <code>${esc(val)}</code></div>` : "";
  // Признак кривого разбора таблицы: таб внутри поля означает, что в одну
  // ячейку влез весь ряд — вместе с паролями открытым текстом. Молчать об
  // этом нельзя: человек иначе читает мусор как имя аккаунта.
  const broken = /\t/.test(String(rec.account_name || "") + String(rec.login || ""));
  return `<div class="card flat" style="margin-top:8px">
    <div class="name">${esc(String(rec.account_name || session).split("\t")[0])}</div>
    ${broken ? `<div class="note bad">${ic("warn","bad")}Строка разобрана неверно:
      в одно поле попал весь ряд таблицы. Данные ниже могут быть смещены.</div>` : ""}
    ${line("Имя сессии", session)}
    ${line("Фармер (кто прогрел акк)", rec.farmer)}
    ${rec.fb_link ? `<div class="meta"><a href="${esc(rec.fb_link)}" target="_blank">Профиль FB ↗</a></div>` : ""}
    ${line("Логин", rec.login)}
    ${line("Пароль аккаунта", s.pass_account)}
    ${line("Пароль почты", s.pass_email)}
    ${line("Резервная почта", s.reserve_email)}
    ${line("Пароль резервной", s.reserve_email_pass)}
    ${s.twofa && isTotpSecret(s.twofa)
      ? `<label class="f">2FA — код сейчас</label><div id="authBox"></div>
         <details style="margin-top:4px"><summary class="meta">показать секрет</summary>
         ${line("2FA-секрет", s.twofa)}</details>`
      : line("2FA", s.twofa)}
    ${line("Дата рождения", s.dob)}
    ${line("Телефон", s.phone)}
    ${rec.updated_at ? `<div class="meta">из таблицы, снимок от ${
      esc(String(rec.updated_at).slice(0, 10))}</div>` : ""}
    <div class="meta" style="margin-top:6px;opacity:.7">Не пересылайте — это доступ к аккаунту.</div>
  </div>`;
}
function mountRecovery(rec) {
  const s = rec.secret || {};
  const ab = document.getElementById("authBox");
  if (ab && s.twofa && isTotpSecret(s.twofa)) mountAuthenticator(ab, s.twofa);
}

// Картотека: поиск по всей таблице аккаунтов, а не только по тем, у кого
// заведён токен. До этого попасть к строке можно было лишь через кабинет —
// то есть аккаунт без лички был в базе, но недостижим с экрана.
async function viewVault() {
  const q = state.vaultQ || "";
  const d = await api("/api/recovery/search", {q});
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);
  const list = (d.rows || []).map(r => `
    <div class="card" data-vault="${esc(r.session_name)}">
      <div class="row">
        <span class="name">${esc(String(r.account_name || r.session_name).split("\t")[0])}</span>
        <span class="meta when">${esc(r.farmer || "")}</span></div>
      <div class="meta">${esc(r.session_name)}</div>
      ${r.login ? `<div class="meta">${esc(String(r.login).split("\t")[0])}</div>` : ""}
      <div class="ctlnote" data-vaultbox="${esc(r.session_name)}"></div>
    </div>`).join("");
  render(`
    <span class="back" data-go="more">‹ Ещё</span>
    <h1>${ic("key")}Картотека аккаунтов</h1>
    <div class="card flat">
      <label class="f">Имя аккаунта, имя сессии, фармер или логин</label>
      <input class="text" id="vq" value="${esc(q)}" placeholder="напр. Ариана Быков"
        spellcheck="false">
      <button class="act" id="vgo">${ic("radio")}Найти</button>
      <div class="meta" style="margin-top:8px">Строк в картотеке: ${int(d.total || 0)}${
        d.updated_at ? ` · снимок от ${esc(String(d.updated_at).slice(0, 10))}` : ""}</div>
    </div>
    ${q ? (list ? `<h2>Найдено · ${int((d.rows || []).length)}</h2>${list}`
                : `<div class="empty">Ничего не нашлось.</div>`)
        : `<div class="empty">Введите запрос — картотека большая, показывать её целиком незачем.</div>`}`);
  const go = () => { state.vaultQ = document.getElementById("vq").value.trim();
                     show("vault"); };
  document.getElementById("vgo")?.addEventListener("click", go);
  document.getElementById("vq")?.addEventListener("keydown", e => {
    if (e.key === "Enter") go();
  });
}

async function viewAccount(actId) {
  const d = await api("/api/account", {act_id: actId});
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);
  const a = d.account, t = d.totals, cur = a.currency || "";
  const admin = state.role === "admin";
  const acc = d.access || null;
  const dead = acc && acc.status === "needs_reconnect";
  const pf = acc ? await proxyField() : "";
  const accessBlock = acc ? `
    <h2>Доступ (токен)</h2>
    ${dead ? `<div class="note bad"><b>Нет доступа.</b>
      Причина: ${esc(acc.last_error || "неизвестна")}${acc.last_checked_at ?
        ` · выявлено ${esc(ago(acc.last_checked_at))}` : ""}<br>
      Пока токен мёртв, статистика не собирается — замените ниже.</div>` : ""}
    <div class="card flat">
      <div class="row"><span class="name">${esc(acc.session_name || acc.label || "токен")}</span>
        <span class="status ${dead ? "bad" : acc.status === "ok" ? "ok" : "off"}">
          ${dead ? "мёртв" : acc.status === "ok" ? "живой" : esc(acc.status)}</span></div>
      <label class="f">Имя сессии</label>
      <input class="text" id="sessName" value="${esc(acc.session_name || "")}"
        placeholder="fm FB mf17_2163 12.08 AS">
      <label class="f">${dead ? "Новый мультитокен" : "Заменить мультитокен"}</label>
      <textarea id="secret" placeholder="eyJ0b2tlбiI6…" spellcheck="false"></textarea>
      ${pf}
      <button class="act" id="save">${dead ? "Переподключить" : "Заменить токен"}</button>
      <div class="meta" id="saveNote" style="margin-top:8px"></div>
    </div>
    <button class="act ghost" id="probeBtn" style="margin-top:8px">
      ${ic("radio")}Проверить доступ к Meta</button>
    <div class="ctlnote" id="probeNote"></div>
    <button class="act ghost" id="recoveryBtn" data-act="${esc(actId)}"
      style="margin-top:8px">${ic("key")}Данные восстановления</button>
    <div id="recoveryBox"></div>` : "";

  const kpis = Number(t.spend) ? `
    <div class="kpi hero"><div class="l">Спенд</div>
      <div class="v">${money(t.spend)} <span style="font-size:16px;opacity:.8">${esc(cur)}</span></div></div>
    <div class="kpis">
      <div class="kpi grad"><div class="l">CTR</div><div class="v">${pct(t.ctr)}</div>
        ${(d.daily || []).length >= 5 ? sparkline(d.daily, "clicks", "#0a5") : ""}
        <div class="n">${int(t.clicks)} кликов · CPC ${money(t.cpc)}</div></div>
      <div class="kpi"><div class="l">Показы</div><div class="v">${int(t.impressions)}</div>
        <div class="n">${Number(t.reach) ? "охват " + int(t.reach) : "CPM " + money(t.cpm)}</div></div>
    </div>
    ${Number(t.leads) || Number(t.purchases) || Number(t.revenue) ? `
    <div class="kpis">
      ${Number(t.leads) ? `<div class="kpi"><div class="l">Лиды</div>
        <div class="v">${int(t.leads)}</div>
        <div class="n">цена лида ${money(t.cpl)} ${esc(cur)}</div></div>` : ""}
      ${Number(t.revenue) ? `<div class="kpi"><div class="l">Выручка (пиксель)</div>
        <div class="v">${money(t.revenue)}</div>
        <div class="n">ROAS ${money(t.roas)} · покупок ${int(t.purchases)}</div></div>`
        : Number(t.purchases) ? `<div class="kpi"><div class="l">Покупки</div>
        <div class="v">${int(t.purchases)}</div>
        <div class="n">ценность не пришла из пикселя</div></div>` : ""}
    </div>` : ""}` : `<div class="empty">За период открута не было.</div>`;

  // Паспорт кабинета: то, что не меняется каждый день, но нужно при разборе
  // бана и при сверке с картой. В подзаголовок это не влезает.
  const fmtDate = v => v ? new Date(v).toLocaleDateString("ru-RU",
    {day:"numeric", month:"short", year:"numeric"}) : "—";
  const passport = `<h2>Паспорт кабинета</h2>
    <div class="card flat">
      <div class="meta"><b>ID:</b> <code>${esc(a.act_id)}</code></div>
      <div class="meta"><b>Карта:</b> ${esc(a.funding_display || "—")}${
        // Meta отдаёт тип фандинга то словом, то числовым кодом. Код
        // человеку ничего не говорит — «тип 1» только мешает.
        /[a-zа-я]/i.test(String(a.funding_type || "")) ?
          ` · ${esc(a.funding_type)}` : ""}</div>
      <div class="meta"><b>Дневной лимит:</b> ${money(a.daily_spend_limit)} ${esc(cur)}${
        Number(a.spend_cap) ? ` · потолок ${money(a.spend_cap)}` : " · потолка нет"}</div>
      <div class="meta"><b>Всего потрачено:</b> ${money(a.amount_spent)} ${esc(cur)} ·
        несписано ${money(a.balance)}</div>
      <div class="meta"><b>Следующее списание:</b> ${fmtDate(a.next_bill_date)}</div>
      <div class="meta"><b>Создан:</b> ${fmtDate(a.created_time)} ·
        часовой пояс ${esc(a.timezone_name || "—")}</div>
      ${a.bm_id ? `<div class="meta"><b>BM:</b> <code>${esc(a.bm_id)}</code></div>` : ""}
      ${a.account_status !== 1 ? `<div class="meta"><b>Причина блокировки:</b>
        ${esc(a.disable_label || "не указана")}${
        a.disable_reason ? ` (код ${esc(a.disable_reason)})` : ""}</div>` : ""}
    </div>`;

  // Списания FB — единственный точный факт о деньгах. Расхождение с открутом
  // законно: FB списывает по порогу, а не в момент показа, поэтому суммы
  // показаны рядом, но не выдаются за одну и ту же величину.
  const tx = d.transactions || [], txt = d.tx_totals || {};
  const txBlock = tx.length ? `<h2>Списания FB</h2>
    <div class="card flat">
      <div class="row"><span class="name">Предъявлено к оплате</span>
        <span class="money">${money(txt.amount)} ${esc(txt.currency || cur)}</span></div>
      <div class="meta">${int(txt.count)} списаний${
        Number(txt.tax) ? ` · НДС ${money(txt.tax)}` : ""}${
        Number(t.spend) ? ` · открут за период ${money(t.spend)} — FB списывает
        по порогу, поэтому цифры расходятся законно` : ""}</div>
    </div>` : "";
    // Список отдельных списаний убран как бесполезный шум (решение владельца):
    // на экране остаётся только сводная сумма — единственная точная цифра.

  const ads = (d.ads || []).map(ad => `
    <div class="card flat"><div class="creative">
      ${ad.thumb_url ? `<img src="${esc(ad.thumb_url)}" alt="" loading="lazy">` : ""}
      <div style="min-width:0;flex:1">
        <div class="row"><span class="name">${esc(ad.title || ad.name || ad.ad_id)}</span>
          ${ad.spend !== undefined ? `<span class="money">${money(ad.spend)} ${esc(cur)}</span>` : ""}
        </div>
        ${ad.body ? `<div class="body">${esc(ad.body)}</div>` : ""}
        <div class="meta">${esc(ad.effective_status || "")}
          ${ad.impressions !== undefined ?
            ` · показы ${int(ad.impressions)} · клики ${int(ad.clicks)}` : ""}</div>
        <div class="links">
          ${ad.preview_url ? `<a href="${esc(ad.preview_url)}" target="_blank">Открыть крео</a>` : ""}
          ${ad.instagram_url ? `<a href="${esc(ad.instagram_url)}" target="_blank">Instagram</a>` : ""}
          ${ad.permalink ? `<a href="${esc(ad.permalink)}" target="_blank">Facebook</a>` : ""}
          ${ad.link_url ? `<a href="${esc(ad.link_url)}" target="_blank">Лендинг</a>` : ""}
        </div>
      </div></div></div>`).join("");

  // --- Контроль: доступы, журнал, пиксель ------------------------------- //
  // Доступ к кабинету — факт со стороны Meta, а не наша запись о владельце.
  // Расхождение здесь означает, что в кабинет может зайти кто-то ещё.
  const usersBlock = (d.users || []).length ? `<h2>Доступ к кабинету</h2>
    <div class="card flat">
      ${d.users.map(u => `<div class="row" style="padding:3px 0">
        <span class="name">${esc(u.name || u.user_id)}</span>
        <span class="meta">${esc((u.tasks || "").replace(/,/g, " · ").toLowerCase())}</span>
      </div>`).join("")}
      <div class="meta" style="margin-top:8px">Список отдаёт Meta. Если здесь
        есть лишний человек — доступ у него действительно есть, независимо
        от того, за кем кабинет числится у нас.</div>
    </div>` : "";

  // Журнал изменений: снапшот отвечает «что стало», журнал — «кто сделал».
  const actIcon = t => /delete|remove|disable|reject/i.test(t) ? ic("trash","bad")
    : /add|create/i.test(t) ? ic("plus","ok")
    : /budget|bid|limit/i.test(t) ? ic("money","warn") : ic("pulse","dim");
  // Журнал свёрнут по умолчанию: он длиннее всего остального на экране,
  // а нужен в одном случае из десяти — когда выясняют, кто что поменял.
  // В заголовке оставляем то, ради чего его открывают: сколько записей
  // и когда было последнее изменение.
  const acts = (d.activities || []).length ? `<details class="fold">
    <summary><span class="chev">▶</span>Что менялось
      <span class="cnt">${int(d.activities.length)}${
        d.activities[0]?.event_time
          ? ` · последнее ${esc(ago(d.activities[0].event_time))}` : ""}</span>
    </summary>` +
    d.activities.slice(0, 20).map(a => `<div class="card flat">
      <div class="row">
        <span class="name">${actIcon(a.event_type)}${esc(a.event_label
          || a.event_type || "изменение")}</span>
        <span class="meta">${esc(ago(a.event_time))}</span></div>
      <div class="meta">${esc(a.actor_name || "неизвестно кто")}${
        a.object_name ? " → " + esc(a.object_name) : ""}</div>
    </div>`).join("") + `</details>` : "";

  const pixels = (d.pixels || []).length ? `<h2>Пиксели</h2>
    <div class="card flat">
      ${d.pixels.map(px => `<div class="row" style="padding:3px 0">
        <span class="name">${esc(px.name || px.pixel_id)}</span>
        <span class="meta">${px.last_fired_at
          ? "срабатывал " + esc(ago(px.last_fired_at)) : "не срабатывал"}</span>
      </div>`).join("")}
    </div>` : (Number(t.leads) || Number(t.purchases) ? "" :
    `<div class="note">Пикселей на кабинете нет — поэтому лидов и покупок
      в статистике не будет. Это не сбой сбора.</div>`);

  // Автоправила. Стоят сразу за журналом намеренно: журнал показывает,
  // что бюджет срезан, и называет автором робота — правило объясняет,
  // по какому условию он это сделал. Порознь каждый отвечает на половину.
  const RULE_ACT = {PAUSE:["pause","ставит на паузу"],
    UNPAUSE:["play","снимает с паузы"], CHANGE_BUDGET:["money","меняет бюджет"],
    CHANGE_BID:["target","меняет ставку"], ROTATE:["repeat","ротирует"],
    NOTIFICATION:["bell","только уведомляет"], PING_ENDPOINT:["radio","дёргает вебхук"]};
  const ruleAct = a => {
    const [name, word] = RULE_ACT[a] || ["gear", (a || "").toLowerCase()];
    return ic(name, "dim") + esc(word);
  };
  const rules = (d.rules || []).length ? `<h2>Автоправила</h2>` +
    d.rules.map(r => `<div class="card flat">
      <div class="row">
        <span class="name">${dot(r.status === "ENABLED" ? "ok" : "off")}${esc(r.name || r.rule_id)}</span>
        <span class="meta">${esc(r.schedule || "")}</span></div>
      <div class="meta">${ruleAct(r.action)}${
        r.condition_text ? ", если " + esc(r.condition_text) : ""}</div>
    </div>`).join("") +
    `<div class="note">Эти правила меняют бюджеты и статусы сами. Изменение
      от них попадёт в журнал выше, но автором там будет робот — причину
      называет только правило.</div>` : "";

  const titles = {age:"Возраст", gender:"Пол", platform:"Площадка",
                  device:"Устройство", region:"Регион"};
  const bd = Object.entries(d.breakdowns || {})
    .filter(([, rows]) => rows?.length)
    .map(([kind, rows]) => `<h2>${titles[kind] || kind}</h2>${bars(rows, cur)}`).join("");

  render(`
    <span class="back" data-go="accounts">‹ Аккаунты</span>
    <h1><i class="dot ${a.account_status !== 1 ? "bad" : dead ? "warn" : "ok"}"></i>${esc(a.name || a.act_id)}</h1>
    <p class="sub">${esc(a.session_name || acc?.session_name || "")}${(a.session_name||acc?.session_name)?" · ":""}${esc(a.status_label || "")}${a.owner_name ?
      " · " + esc(a.owner_name) : " · без владельца"}
      · лимит ${money(a.daily_spend_limit)} · карта •${esc(a.funding_last4 || "—")}</p>
    ${dead ? `<div class="note bad">${ic("key")}Нет доступа — переподключите токен ниже.</div>` : ""}
    ${periodChips()}
    ${kpis}
    ${d.billing && d.billing.known ? `<div class="card flat">
      <div class="row"><span class="name">${ic("card")}Следующее списание</span>
        <span class="money">~${money(d.billing.expected_amount)} ${esc(d.billing.currency)}</span></div>
      <div class="meta">${new Date(d.billing.when).toLocaleDateString("ru-RU",
        {day:"numeric",month:"long"})} · через ${d.billing.days_left} дн ·
        ${esc(d.billing.rule)} · несписано ${money(d.billing.balance)}</div>
    </div>` : ""}
    ${(d.daily || []).length ? `<div class="card flat">
      <div class="row"><span class="name">Спенд по дням</span>
        <span class="meta when">${esc(cur)}</span></div>
      ${chartBox(d.daily, {key:"spend", unit:cur})}</div>` : ""}
    <h2>Кампании</h2>
    <div id="campWrap"><div class="meta">Загружаю…</div></div>
    ${admin ? `<button class="act ghost" id="ownerBtn">${ic("user")}Сменить владельца</button>
      <div id="ownerBox"></div>` : ""}
    ${d.countries?.length ? `<h2>Страны</h2>${bars(d.countries, cur)}` : ""}
    ${(d.adsets && d.adsets.length) ? `<div class="note">Аудитория и бюджеты
      адсетов — внутри кампании: выберите её выше. Здесь они дублировали бы
      то же самое в отрыве от кампании, к которой относятся.</div>` : ""}
    ${ads ? `<h2>Крео</h2>${ads}` : ""}
    ${bd}
    ${txBlock}
    ${usersBlock}
    ${acts}
    ${rules}
    ${pixels}
    ${passport}
    ${accessBlock}`);

  // Данные восстановления — по явному нажатию, не в общем ответе карточки.
  document.getElementById("recoveryBtn")?.addEventListener("click", async (e) => {
    e.stopPropagation();
    const box = document.getElementById("recoveryBox");
    if (box.innerHTML) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="meta">Загружаю…</div>`;
    const r = await api("/api/account/recovery", {act_id: actId});
    if (r.error) { box.innerHTML = `<div class="note bad">${esc(r.error)}</div>`; return; }
    box.innerHTML = recoveryCard(r.recovery, r.session);
    mountRecovery(r.recovery);
  });

  // Замена/переподключение токена прямо из аккаунта.
  if (acc) {
    proxyWire();
    const save = document.getElementById("save");
    save?.addEventListener("click", async () => {
      const secret = document.getElementById("secret").value.trim();
      const note = document.getElementById("saveNote");
      if (!secret) { note.textContent = "Вставьте токен."; return; }
      save.disabled = true; save.textContent = "Сохраняю…";
      const nm = document.getElementById("sessName");
      if (nm && nm.value.trim()) await apiPost("/api/identity/rename",
        {id: acc.id, name: nm.value.trim()});
      const res = await apiPost("/api/identity/retoken",
        {id: acc.id, secret, ...proxyValue()});
      note.textContent = res.error || "Готово. Проверю на ближайшем сборе.";
      if (!res.error) { tg?.HapticFeedback?.notificationOccurred?.("success");
        setTimeout(() => show("accounts", actId), 900); }
      else { save.disabled = false; save.textContent = dead ? "Переподключить" : "Заменить токен"; }
    });
  }

  // Проверка доступа. Гадать, работает ли прокси, — худший способ: пустой
  // сбор, мёртвая личка и отказ управления выглядят одинаково, а причины
  // разные. Один короткий запрос `me` отвечает прямо.
  document.getElementById("probeBtn")?.addEventListener("click", async () => {
    const btn = document.getElementById("probeBtn");
    const note = document.getElementById("probeNote");
    btn.disabled = true;
    note.className = "ctlnote"; note.textContent = "Стучусь в Meta…";
    const r = await apiPost("/api/proxy/check", {act_id: actId});
    btn.disabled = false;
    if (r.error && r.ok === undefined) {
      note.className = "ctlnote bad"; note.textContent = r.error; return;
    }
    if (r.ok) {
      note.className = "ctlnote ok";
      note.textContent = `Meta отвечает: ${r.who} · ${r.via} · ${r.ms} мс`
        + (r.fixed ? ` · статус лички поправлен: было «${r.was}», стало «живая»` : "");
      // Статус мог измениться — перечитываем экран, чтобы карточка
      // не продолжала показывать «нет доступа» над работающей личкой.
      if (r.fixed) setTimeout(() => show("accounts", actId), 1400);
    } else {
      note.className = "ctlnote bad";
      note.textContent = `Не достучались через ${r.via} за ${r.ms} мс. ${r.error}`;
    }
  });

  // --- кампании прямо в карточке кабинета -------------------------------- //
  // Раньше это был отдельный экран: чтобы сравнить кампанию с кабинетом,
  // надо было уйти, посмотреть, вернуться и вспомнить. Теперь переключение
  // идёт на месте — вместе с графиком, адсетами и управлением.
  mountCampaigns(actId, cur, admin);

  document.getElementById("ownerBtn")?.addEventListener("click", async () => {
    const box = document.getElementById("ownerBox");
    if (box.innerHTML) { box.innerHTML = ""; return; }
    const list = await api("/api/accounts");
    box.innerHTML = `<div class="card flat">
      <div class="meta">Спенд с сегодняшнего дня пойдёт выбранному маркетологу.
        Прошлое остаётся за прежним — история не переписывается.</div>
      ${(list.marketers || []).map(m => `<button class="act ghost"
        data-owner="${esc(m.id)}">${esc(m.name)}</button>`).join("")}</div>`;
    box.querySelectorAll("[data-owner]").forEach(b =>
      b.addEventListener("click", async () => {
        const res = await apiPost("/api/account/owner",
          {act_id: actId, marketer_id: b.dataset.owner});
        if (res.error) { box.innerHTML = `<div class="note bad">${esc(res.error)}</div>`; return; }
        tg?.HapticFeedback?.notificationOccurred?.("success");
        show("accounts", actId);
      }));
  });
}

// --- кампании внутри карточки кабинета ------------------------------------ //
// Один блок отвечает сразу на три вопроса, которые всегда задают подряд:
// какие кампании есть, как идёт выбранная, и что с ней сделать. Разносить
// их по экранам значило заставлять человека держать цифры в голове.
const STATUS_WORD = {ACTIVE:"работает", PAUSED:"на паузе",
  CAMPAIGN_PAUSED:"кампания на паузе", ADSET_PAUSED:"адсет на паузе",
  ARCHIVED:"в архиве", DELETED:"удалена", IN_PROCESS:"на проверке",
  WITH_ISSUES:"с проблемой", PENDING_REVIEW:"на модерации",
  DISAPPROVED:"отклонена", PREAPPROVED:"условно одобрена"};
const statusWord = v => STATUS_WORD[v] || String(v || "").toLowerCase();
const isLive = c => (c.effective_status || c.status) === "ACTIVE";

// Значок связи с Keitaro в списке кампаний. Три состояния, и все три —
// разные: связь есть, связи нет у живых объявлений (это деньги в пустоту),
// связи нет у остановленных (это архив, трогать нечего).
function ktBadge(m) {
  if (!m) return "";
  const ids = (m.kt || []).map(k => k.kt_id);
  const parts = [];
  if (ids.length) parts.push(`<span class="meta">${ic("external")}Keitaro
    <b>${ids.map(i => "id " + int(i)).join(", ")}</b></span>`);
  // Куда льёт кампания. Показываем сам адрес, а не только домен: параметры
  // в ссылке — это макросы, по которым потом ищут клик в трекере.
  for (const l of (m.links || []).slice(0, 4)) {
    parts.push(`<div class="meta">${ic("link")}<a href="${esc(l.link)}"
      target="_blank" rel="noopener" class="url">${esc(cut(l.link, 78))}</a>
      <span class="meta"> · объявлений ${int(l.ads)}${
        Number(l.kt_id) ? ` · Keitaro id ${int(l.kt_id)}` : ""}</span></div>`);
  }
  if ((m.links || []).length > 4)
    parts.push(`<div class="meta">…и ещё ${int(m.links.length - 4)} адресов</div>`);
  if (m.gap_live) parts.push(`<div class="note bad">${ic("warn","bad")}
    <b>${int(m.gap_live)}</b> живых объявлений без кампании в трекере —
    трафик уходит в никуда</div>`);
  else if (m.gap_ads) parts.push(`<div class="meta">${ic("warn","dim")}
    ${int(m.gap_ads)} остановленных объявлений без связи с трекером</div>`);
  if (!parts.length && !ids.length) return "";
  return parts.join("");
}

async function mountCampaigns(actId, cur, admin) {
  const wrap = document.getElementById("campWrap");
  if (!wrap) return;
  const d = await api("/api/campaigns", {act_id: actId, period: state.period});
  if (d.error) { wrap.innerHTML = `<div class="note bad">${esc(d.error)}</div>`; return; }
  const list = d.campaigns || [];
  if (!list.length) {
    wrap.innerHTML = `<div class="empty">За период кампаний нет.</div>`;
    return;
  }
  const kmap = d.keitaro_map || {};
  state.open = state.open || {};

  wrap.innerHTML = `<div class="count">кампаний ${int(list.length)} ·
      нажмите на строку, чтобы раскрыть адсеты</div>` +
    list.map(c => campNode(c, cur, kmap[c.campaign_id])).join("");
  wireControls(wrap, actId, cur);
  wrap.dataset.act = actId;
  wrap.dataset.cur = cur;

  // Раскрытое прошлым разом открываем снова: смена периода не должна
  // схлопывать дерево — человек смотрел конкретный адсет, а не «вообще».
  for (const key of Object.keys(state.open)) {
    if (state.open[key]) openNode(wrap, key, actId, cur, true);
  }
}

const cut = (v, n) => {
  const t = String(v || "").replace(/\s+/g, " ").trim();
  return t.length > n ? t.slice(0, n) + "…" : t;
};

// Шапка любого узла дерева: стрелка, точка состояния, имя, деньги.
// Одинаковая на всех трёх уровнях намеренно — так глаз не переучивается
// при переходе с кампании на адсет и с адсета на объявление.
function nodeHead(key, level, name, node, money_, cur, openable) {
  return `<div class="row nodehead" ${openable ? `data-toggle="${esc(key)}"` : ""}>
    <span class="name">${openable
      ? `<span class="chev" data-chev="${esc(key)}">▶</span>` : `<span class="chev"></span>`}
      <span class="lvl">${esc(level)}</span>${dot(isLive(node) ? "ok" : "off")}${esc(name)}</span>
    <span class="money">${money_} ${esc(cur)}</span></div>`;
}

function statLine(n) {
  const ctr = Number(n.impressions) ? (Number(n.clicks) / Number(n.impressions)) * 100 : 0;
  const cpc = Number(n.clicks) ? Number(n.spend) / Number(n.clicks) : 0;
  return `${esc(statusWord(n.effective_status || n.status))} ·
    показы ${int(n.impressions)} · клики ${int(n.clicks)}${
    Number(n.impressions) ? ` · CTR ${pct(ctr)}` : ""}${
    Number(n.clicks) ? ` · CPC ${money(cpc)}` : ""}${
    Number(n.leads) ? ` · лиды ${int(n.leads)}` : ""}`;
}

function budgetLine(n) {
  return Number(n.daily_budget) ? `дневной бюджет ${money(n.daily_budget)}`
       : Number(n.lifetime_budget) ? `общий бюджет ${money(n.lifetime_budget)}`
       : "бюджет на адсетах";
}

function campNode(c, cur, km) {
  const key = "camp:" + c.campaign_id;
  return `<div class="card" data-node="${esc(key)}">
    ${nodeHead(key, "кампания", c.name || c.campaign_id, c, money(c.spend), c.currency || cur, true)}
    <div class="meta">${statLine(c)}</div>
    <div class="meta">${budgetLine(c)}${
      Number(c.budget_remaining) ? ` · остаток ${money(c.budget_remaining)}` : ""}${
      c.objective ? ` · ${esc(c.objective.toLowerCase())}` : ""}</div>
    ${(c.issues || []).map(t => `<div class="note bad">${ic("warn")}${esc(t)}</div>`).join("")}
    ${ktBadge(km)}
    ${controlBar("campaign", c, cur)}
    <div class="ctlnote" data-note="campaign:${esc(c.campaign_id)}"></div>
    <div class="kids" data-kids="${esc(key)}" hidden></div>
  </div>`;
}

function adsetNode(a, cur) {
  const key = "adset:" + a.adset_id;
  // Пол в Meta — цифра: 1 мужчины, 2 женщины, пусто или 0 — все. Печатать
  // «0» в описании аудитории значит показывать человеку внутренний код.
  const g = String(a.genders || "").replace(/[^12]/g, "");
  const gender = g === "1" ? "мужчины" : g === "2" ? "женщины" : "";
  const who = [a.countries, gender, (a.age_min || a.age_max)
    ? `${int(a.age_min)}–${int(a.age_max)} лет` : "",
    a.locales ? esc(a.locales) : ""].filter(Boolean).join(" · ");
  return `<div class="card" data-node="${esc(key)}" data-act="${esc(a.act_id || "")}">
    ${nodeHead(key, "адсет", a.name || a.adset_id, a, money(a.spend), cur, true)}
    <div class="meta">${statLine(a)}</div>
    <div class="meta">${budgetLine(a)}${
      a.optimization_goal ? ` · ${esc(String(a.optimization_goal).toLowerCase())}` : ""}</div>
    ${who ? `<div class="meta">${ic("target")}${esc(cut(who, 90))}</div>` : ""}
    ${controlBar("adset", a, cur)}
    <div class="ctlnote" data-note="adset:${esc(a.adset_id)}"></div>
    <div class="kids" data-kids="${esc(key)}" hidden></div>
  </div>`;
}

function adNode(a, cur) {
  // У объявления своих кнопок управления нет: Meta не даёт менять бюджет
  // на этом уровне, а включение-выключение делается адсетом. Зато здесь
  // единственное место, где видно связь с трекером — она живёт на ссылке.
  const kt = Number(a.kt_id)
    ? `<div class="meta">${ic("external")}Keitaro <b>id ${int(a.kt_id)}</b>${
        a.kt_name ? " · " + esc(cut(a.kt_name, 40)) : ""}</div>`
    : a.link_url
      ? `<div class="meta">${ic("warn", isLive(a) ? "bad" : "dim")}${
          esc(a.kt_matched_by || "связь с Keitaro не найдена")}</div>`
      : "";
  return `<div class="card flat" data-node="ad:${esc(a.ad_id)}">
    ${nodeHead("ad:" + a.ad_id, "объявление",
               cut(a.name || a.title || a.ad_id, 60), a, money(a.spend), cur, false)}
    <div class="meta">${statLine(a)}</div>
    ${a.link_url ? `<div class="meta">${ic("link")}<a href="${esc(a.link_url)}"
      target="_blank" rel="noopener" class="url">${esc(a.link_url)}</a></div>` : ""}
    ${kt}
    ${(a.issues || []).map(t => `<div class="note bad">${ic("warn")}${esc(t)}</div>`).join("")}
    <div class="meta">${[a.preview_url ? `<a href="${esc(a.preview_url)}" target="_blank">предпросмотр ↗</a>` : "",
      a.permalink ? `<a href="${esc(a.permalink)}" target="_blank">пост ↗</a>` : ""]
      .filter(Boolean).join(" · ")}</div>
  </div>`;
}

// Раскрытие узла. Дети грузятся по первому открытию и дальше живут в DOM:
// повторное нажатие только прячет их, а не выбрасывает — иначе каждое
// схлопывание стоило бы ещё одного запроса.
async function openNode(root, key, actId, cur, silent) {
  const box = root.querySelector(`[data-kids="${key}"]`);
  const chev = root.querySelector(`[data-chev="${key}"]`);
  if (!box) return;
  const opening = box.hidden;
  if (!silent) state.open[key] = opening;
  if (!opening) { box.hidden = true; chev?.classList.remove("open"); return; }
  box.hidden = false; chev?.classList.add("open");
  if (box.dataset.loaded) return;

  box.innerHTML = `<div class="meta">Загружаю…</div>`;
  const [kind, id] = [key.slice(0, key.indexOf(":")), key.slice(key.indexOf(":") + 1)];
  if (kind === "camp") {
    const d = await api("/api/campaign",
      {act_id: actId, campaign_id: id, period: state.period});
    if (d.error) { box.innerHTML = `<div class="note bad">${esc(d.error)}</div>`; return; }
    const sets = d.adsets || [];
    box.innerHTML = (d.keitaro_gaps || []).length ? gapBlock(d.keitaro_gaps) : "";
    box.innerHTML += sets.length
      ? sets.map(a => adsetNode({...a, act_id: actId}, cur)).join("")
      : `<div class="empty">Адсетов в кампании нет.</div>`;
  } else {
    const d = await api("/api/adset",
      {act_id: actId, adset_id: id, period: state.period});
    if (d.error) { box.innerHTML = `<div class="note bad">${esc(d.error)}</div>`; return; }
    const ads = d.ads || [];
    box.innerHTML = ads.length ? ads.map(a => adNode(a, cur)).join("")
      : `<div class="empty">Объявлений в адсете нет.</div>`;
  }
  box.dataset.loaded = "1";
  wireControls(box, actId, cur);
}

function gapBlock(gaps) {
  return `<div class="card flat">
    <div class="row"><span class="name">${ic("warn","bad")}Без связи с Keitaro</span>
      <span class="meta when">ссылок ${int(gaps.length)}</span></div>
    ${gaps.map(g => `<div class="meta">${Number(g.live)
      ? `${ic("warn","bad")}<b>живых ${int(g.live)}</b> из ${int(g.ads)}`
      : `остановленных ${int(g.ads)}`}
      <br><code>${esc(cut(g.link || "—", 70))}</code></div>`).join("")}
  </div>`;
}

function controlBar(kind, node, cur) {
  const id = kind === "campaign" ? node.campaign_id : node.adset_id;
  if (!id) return "";
  const live = isLive(node);
  const blockedBy = kind === "adset" && !live
    && String(node.effective_status || "").startsWith("CAMPAIGN_")
    ? "кампания" : "";
  // Какой бюджет у узла живёт — тот и предлагаем менять. Подменять дневной
  // общим значит менять смысл кампании, а не её величину.
  const lifetime = !Number(node.daily_budget) && Number(node.lifetime_budget) > 0;
  const budget = Number(lifetime ? node.lifetime_budget : node.daily_budget) || 0;
  const editable = kind === "adset" ? Number(node.daily_budget) > 0 : budget > 0;
  return `<div class="ctl" data-kind="${kind}" data-id="${esc(id)}">
    <button class="${live ? "stop" : "go"}" data-op="${live ? "pause" : "resume"}"
      ${blockedBy ? "disabled" : ""}>
      ${live ? ic("pause") + "Остановить" : ic("play") + "Запустить"}</button>
    ${blockedBy ? `<span class="lab">остановлен не здесь, а на уровне
      кампании — запускать надо её</span>` : ""}
    ${editable ? `<span class="lab">${lifetime ? "общий" : "дневной"} ${esc(cur)}</span>
      <input type="text" inputmode="decimal" value="${money(budget)}"
        data-budget aria-label="бюджет">
      <button data-op="budget">${ic("check")}Применить</button>` : ""}
  </div>`;
}

function wireControls(root, actId, cur) {
  root.querySelectorAll(".ctl").forEach(bar => {
    const kind = bar.dataset.kind, id = bar.dataset.id;
    const note = root.querySelector(`[data-note="${kind}:${id}"]`);
    const say = (text, cls="") => { if (note) { note.textContent = text;
      note.className = "ctlnote" + (cls ? " " + cls : ""); } };

    bar.querySelectorAll("button[data-op]").forEach(btn =>
      btn.addEventListener("click", async () => {
        const op = btn.dataset.op;
        const input = bar.querySelector("[data-budget]");
        const value = input ? input.value.trim() : "";

        // Подтверждение спрашиваем здесь, до запроса. За кнопкой чужие
        // деньги, и «нажал не туда» должно стоить одного «Отмена»,
        // а не разбора утром, почему встал открут.
        const what = kind === "campaign" ? "кампанию" : "адсет";
        const ask = op === "pause" ? `Остановить ${what}? Открут прекратится сразу.`
          : op === "resume" ? `Запустить ${what}? Деньги начнут тратиться сразу.`
          : `Поставить бюджет ${value} ${cur}? Изменение уйдёт в Meta сразу.`;
        if (!confirm(ask)) return;

        bar.querySelectorAll("button").forEach(b => b.disabled = true);
        say("Отправляю в Meta…");
        const res = await apiPost(`/api/${kind}/action`,
          {act_id: actId, [kind === "campaign" ? "campaign_id" : "adset_id"]: id,
           op, value});
        bar.querySelectorAll("button").forEach(b => b.disabled = false);
        if (res.error) { say(res.error, "bad");
          tg?.HapticFeedback?.notificationOccurred?.("error"); return; }
        say(res.message || "Готово", "ok");
        tg?.HapticFeedback?.notificationOccurred?.("success");
        // Перечитываем экран: показать прежнее состояние после успешного
        // изменения — значит пригласить нажать ещё раз.
        setTimeout(() => show("accounts", actId), 700);
      }));
  });
}

// Журнал наших действий. Отдельно от журнала Meta: там «что изменилось»,
// здесь «кто из наших это сделал и что было до».
function actionsLog(rows, campaignId) {
  const mine = (rows || []).filter(r => !campaignId || r.target_id === campaignId
    || r.target_kind === "adset");
  if (!mine.length) return "";
  const OPS = {pause:"остановил", resume:"запустил", budget:"сменил бюджет"};
  return `<h2>Что делали отсюда</h2>` + mine.slice(0, 10).map(r => `
    <div class="card flat">
      <div class="row">
        <span class="name">${r.status === "ok" ? ic("check","ok")
          : ic("warn", r.status === "refused" ? "warn" : "bad")}${
          esc(r.actor_name || r.actor_id || "кто-то")} ${esc(OPS[r.op] || r.op)}</span>
        <span class="meta when">${esc(ago(r.at))}</span></div>
      <div class="meta">${esc(cut(r.target_name, 60))}${
        r.before_val || r.after_val ? ` · ${esc(r.before_val || "—")} → ${esc(r.after_val || "—")}` : ""}</div>
      ${r.error ? `<div class="meta">${esc(r.error)}</div>` : ""}
    </div>`).join("");
}
