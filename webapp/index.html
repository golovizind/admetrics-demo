// --- лички -------------------------------------------------------------- //
async function viewIdentities() {
  const d = await api("/api/identities");
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);
  let items = d.identities || [];
  if (state.filter === "dead") items = items.filter(i => i.status === "needs_reconnect");
  if (state.filter === "alive") items = items.filter(i => i.status === "ok");
  if (state.sort === "name") items = [...items].sort((a, b) =>
    String(a.label||"").localeCompare(String(b.label||""), "ru"));

  const {shown, total} = applyList(items, i => `${i.label||""} ${i.marketer_name||""}`);
  const admin = state.role === "admin";
  // Владельца в мете не дублируем при группировке — он в заголовке группы.
  const identCard = i => `
    <div class="card" data-ident="${esc(i.id)}">
      <div class="row"><span class="name"><i class="dot ${IDENT_KIND[i.status] || "off"}"></i>
        ${esc(i.session_name || i.label || i.id)}</span>
        ${Number(i.spend) ? `<span class="money">${money(i.spend)} ${esc(i.currency)}</span>` : ""}
      </div>
      <div class="meta">${esc(identWord(i))}${
        admin ? "" : " · " + esc(i.marketer_name || "")}
        · кабинетов ${i.accounts}${Number(i.spend) ? ` · CTR ${pct(i.ctr)}` : ""}</div>
      ${i.last_error ? `<div class="meta">${ic("warn","bad")}${esc(String(i.last_error).slice(0,90))}</div>` : ""}
    </div>`;
  const cards = admin
    ? mgroups(shown, {
        keyOf: i => i.marketer_id,
        labelOf: g => g[0].marketer_name || "",
        sumOf: g => {
          const dead = g.filter(x => x.status === "needs_reconnect").length;
          return `${int(g.length)} шт${dead ? ` · ${int(dead)} мёртвых` : ""}`;
        },
        cardOf: identCard,
      })
    : shown.map(identCard).join("");
  render(`
    <h1>Лички</h1><p class="sub">${esc(d.period_label)}</p>
    ${periodChips()}
    ${listControls([["all","Все"],["dead","Мёртвые"],["alive","Живые"]],
                   [["spend","спенд"],["name","имя"]])}
    <div class="count">показано ${shown.length} из ${total}</div>
    ${cards || `<div class="empty">Личек нет.</div>`}
    ${moreBtn(shown.length, total)}`);
}

// Права токена. Пустой список — «не проверялось», и это не то же самое,
// что «прав нет»: путать их значит слать человека чинить исправное.
function permsBlock(d) {
  const miss = d.missing_permissions || [];
  if (!(d.permissions || []).length) {
    return `<div class="meta" style="margin-top:8px">Права токена ещё
      не проверялись — они спрашиваются при сборе.</div>`;
  }
  if (!miss.length) {
    return `<div class="meta" style="margin-top:8px">${ic("check","ok")}Все нужные права
      выданы (${d.permissions.length} шт.).</div>`;
  }
  return `<div class="note bad" style="margin-top:8px"><b>Не хватает прав:</b>
    ${miss.map(m => `<div>${esc(m.permission)} — ${esc(m.why)}</div>`).join("")}
    <div style="margin-top:6px;opacity:.8">Пустые данные по этим направлениям
      объясняются именно этим, а не поломкой сбора.</div></div>`;
}

async function viewIdentity(id) {
  const d = await api("/api/identity", {id});
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);
  const i = d.identity, t = d.totals, cur = t.currency || "";
  const dead = i.status === "needs_reconnect";

  const kpis = Number(t.spend) ? `<div class="kpis">
    <div class="kpi"><div class="l">Спенд</div><div class="v">${money(t.spend)}</div>
      <div class="n">${esc(cur)}</div></div>
    <div class="kpi"><div class="l">CTR</div><div class="v">${pct(t.ctr)}</div>
      <div class="n">${int(t.clicks)} кликов</div></div>
    <div class="kpi"><div class="l">CPC</div><div class="v">${money(t.cpc)}</div>
      <div class="n">CPM ${money(t.cpm)}</div></div>
  </div>` : `<div class="empty">За период открута не было.</div>`;

  const accs = (d.accounts || []).map(a => `
    <div class="card" data-act="${esc(a.act_id)}">
      <div class="row"><span class="name"><i class="dot ${dotOf(a.account_status)}"></i>
        ${esc(a.name || a.act_id)}</span></div>
      <div class="meta">${esc(a.status_label || "")}${a.owner_name ?
        " · " + esc(a.owner_name) : ""}</div>
    </div>`).join("");

  // Состояние лички — первое, что нужно знать: без него мёртвая личка
  // выглядела так же, как живая, и «за период пусто» читалось как
  // «не крутил», а не как «токен отвалился».
  const problem = dead
    ? `<div class="note bad"><b>Личка отвалилась.</b> ${esc(i.last_error || "")}<br>
        Пока она мертва, статистика по её кабинетам не собирается —
        замените мультитокен ниже.</div>`
    : (i.last_error ? `<div class="note">${ic("warn")}${esc(i.last_error)}</div>` : "");

  await proxyPool();          // редактор прокси строится синхронно ниже
  const controls = i.status === "revoked" ? "" : `
    <button class="act ghost" data-probe="${esc(i.id)}">
      ${ic("radio")}Проверить доступ к Meta</button>
    <div class="ctlnote" data-probenote="${esc(i.id)}"></div>
    ${proxyLine(i)}
    <button class="act ghost" data-pxopen="${esc(i.id)}">
      ${ic("swap")}Сменить прокси</button>
    ${proxyEdit(i)}
    <button class="act ghost" data-ident-act="${i.status === "disabled" ? "enable" : "disable"}">
      ${i.status === "disabled" ? ic("play") + "Включить" : ic("pause") + "Выключить"}</button>
    <button class="act ghost" data-ident-act="revoke">${ic("trash")}Отозвать секрет</button>`;

  const pf = i.status === "revoked" ? "" : await proxyField();
  const form = i.status === "revoked" ? "" : `
    <h2>${dead ? "Заменить мультитокен" : "Обновить мультитокен"}</h2>
    <div class="card flat">
      <label class="f">Мультитокен FBTOOL или токен EAA…</label>
      <textarea id="secret" placeholder="eyJ0b2tlbiI6…" spellcheck="false"></textarea>
      ${pf}
      <button class="act" id="save">Заменить токен</button>
      <div class="meta" id="saveNote" style="margin-top:8px"></div>
    </div>`;

  render(`
    <span class="back" data-go="identities">‹ Лички</span>
    <h1>${esc(i.session_name || i.label || i.id)}</h1>
    <p class="sub"><span class="status ${IDENT_KIND[i.status] || "off"}">
      ${IDENT_WORDS[i.status] || i.status}</span> · ${esc(i.marketer_name)}
      · проверялась ${i.last_checked_at ? esc(ago(i.last_checked_at)) : "ни разу"}</p>
    ${problem}
    ${permsBlock(d)}
    ${periodChips()}
    ${kpis}
    ${chart(d.daily)}
    ${controls}
    ${accs ? `<h2>Кабинеты лички</h2>${accs}` : ""}
    ${form}`);

  document.querySelectorAll("[data-ident-act]").forEach(b =>
    b.addEventListener("click", async () => {
      const action = b.dataset.identAct;
      if (action === "revoke" &&
          !confirm("Отозвать секрет? Личка перестанет собирать, вернуть нельзя.")) return;
      const res = await apiPost("/api/identity/action", {id, action});
      if (res.error) { alert(res.error); return; }
      tg?.HapticFeedback?.notificationOccurred?.("success");
      show("identities", id);
    }));

  const save = document.getElementById("save");
  proxyWire();
  save?.addEventListener("click", async () => {
    const secret = document.getElementById("secret").value.trim();
    const note = document.getElementById("saveNote");
    if (!secret) { note.textContent = "Вставьте токен."; return; }
    save.disabled = true; save.textContent = "Сохраняю…";
    const nm = document.getElementById("sessName");
    if (nm && nm.value.trim()) await apiPost("/api/identity/rename",
      {id, name: nm.value.trim()});
    const res = await apiPost("/api/identity/retoken", {id, secret, ...proxyValue()});
    if (res.error) {
      note.textContent = res.error;
      save.disabled = false; save.textContent = "Заменить токен";
      return;
    }
    tg?.HapticFeedback?.notificationOccurred?.("success");
    show("identities", id);
  });
}

  });
}

// --- креативы ------------------------------------------------------------ //
// Открут в разрезе креатива, а не объявления. Один ролик живёт в нескольких
// объявлениях сразу, и в обычных списках его расход размазан по строкам —
// здесь он собран обратно.
//
// Экран задуман как черновик связки с CREOSTER: там креатив — карточка
// работы монтажёра, здесь — строка расхода. Пока это просто витрина и
// выгрузка; чем их склеивать, решается отдельно.
const CREATIVE_COLS = [
  ["creative_id", "creative_id"], ["name", "name"], ["spend", "spend"],
  ["impressions", "impressions"], ["clicks", "clicks"],
];

async function viewCreatives() {
  const d = await api("/api/creatives", {period: state.period === "today" ? "all" : state.period,
                                         only_active: state.creoLive ? 1 : 0});
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);
  const all = d.rows || [];
  const t = d.total || {};
  const {shown, total} = applyList(all, r => `${r.name || ""} ${r.creative_id}`);

  const cards = shown.map(r => {
    // Креатив без id — это объявление, поднятое из готового поста: FB не
    // заводит под него отдельный creative. Прятать такие строки нельзя, они
    // тоже тратят деньги, но и путать с настоящими креативами не стоит.
    const anon = !r.creative_id;
    return `
    <div class="card">
      <div class="row">
        <span class="name"><i class="dot ${r.active ? "ok" : "off"}"></i>${
          esc(r.name || "без названия")}</span>
        <span class="money">${money(r.spend)}</span>
      </div>
      <div class="meta">${anon
        ? `<b>без creative_id</b> · из готового поста`
        : `<code class="url">${esc(r.creative_id)}</code>`}</div>
      <div class="meta">показов ${int(r.impressions)} · кликов ${int(r.clicks)}
        · CTR ${money(r.ctr)}% · CPM ${money(r.cpm)}
        · объявлений ${int(r.ads)}${r.active ? `, живых ${int(r.active)}` : ""}
        ${r.first_day ? ` · ${esc(r.first_day)} — ${esc(r.last_day)}` : ""}</div>
    </div>`;
  }).join("");

  render(`
    ${state.role === "admin" ? `<span class="back" data-go="more">‹ Ещё</span>` : ""}
    <h1>${ic("chart")}Креативы</h1>
    <p class="sub">${esc(d.period_label || "")} · креативов ${int(t.creatives || 0)}
      · расход ${money(t.spend)} · показов ${int(t.impressions || 0)}
      · кликов ${int(t.clicks || 0)}</p>
    ${t.no_id ? `<div class="note">${int(t.no_id)} строк без creative_id —
      это объявления, поднятые из готовых постов. Они тратят деньги, но
      отдельного креатива у них в Facebook нет, и связать их с карточкой
      работы будет нечем.</div>` : ""}
    <div class="ctl">
      <button data-creolive="1" class="${state.creoLive ? "on" : ""}">
        ${ic("radio")}${state.creoLive ? "Только живые" : "Все"}</button>
      <button id="creoCsv">${ic("file")}Скачать CSV</button>
      <button id="creoCopy">${ic("link")}Скопировать</button>
    </div>
    <div class="ctlnote" id="creoNote">Колонки выгрузки: creative_id, name,
      spend, impressions, clicks. То же самое отдаёт
      <code>GET /api/v1/creatives</code>.</div>
    <input class="text" id="q" placeholder="Поиск по названию или id"
      value="${esc(state.q || "")}" spellcheck="false">
    ${cards || `<div class="empty">За этот период открута нет.</div>`}
    ${moreBtn(shown.length, total)}`);

  const dl = (text, name, mime) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type: mime}));
    a.download = name; a.click(); URL.revokeObjectURL(a.href);
  };
  document.getElementById("creoCsv")?.addEventListener("click", () => {
    const note = document.getElementById("creoNote");
    if (!all.length) { note.className = "ctlnote"; note.textContent =
      "Нечего выгружать."; return; }
    dl(toCSV(all, CREATIVE_COLS), `creatives-${new Date().toISOString().slice(0,10)}.csv`,
       "text/csv;charset=utf-8");
    note.className = "ctlnote ok"; note.textContent = `Выгружено строк: ${all.length}`;
  });
  document.getElementById("creoCopy")?.addEventListener("click", async () => {
    const note = document.getElementById("creoNote");
    try {
      await navigator.clipboard.writeText(toCSV(all, CREATIVE_COLS));
      note.className = "ctlnote ok"; note.textContent = "Скопировано в буфер.";
    } catch { note.className = "ctlnote bad";
      note.textContent = "Браузер не дал доступ к буферу — скачайте файлом."; }
  });
}

// --- каркас -------------------------------------------------------------- //
// Вкладки под роль: маркетологу не показываем админское — меньше хлама,
// короче путь до нужного. Порядок = частота обращения.
// У маркетолога личка важна только когда сломана — тогда она сама всплывает
// на сводке красной карточкой. Постоянная вкладка под неё не нужна; полный
// список открывается тапом по KPI «Лички». Меньше вкладок — короче путь.
const TABS_MARKETER = [["home","Сводка"],["accounts","Аккаунты"],
                       ["comments","Комменты"]];

// --- SMM-панель (услуги) -------------------------------------------------- //
// Заказ тратит живой баланс панели, поэтому перед отправкой — мягкое
// подтверждение (второй тап), а ключ панели живёт на сервере, не во фронте.
const SMM_STATUS = {Completed:"ok", "In progress":"warn", Processing:"warn",
  Pending:"warn", "In Progress":"warn", Partial:"warn", Canceled:"off",
  Cancelled:"off", Refunded:"off", Fail:"bad", Error:"bad"};

function smmOrderCard(o) {
  const kind = SMM_STATUS[o.status] || "warn";
  return `<div class="card flat">
    <div class="row"><span class="name"><i class="dot ${kind}"></i>#${esc(o.order_id)}
      · ${esc(o.service_name || o.service_id)}</span>
      <span class="money">${money(o.charge, 4)} ${esc(o.currency || "")}</span></div>
    <div class="meta">${esc(o.status || "—")} · ${int(o.quantity)} шт · осталось ${
      int(o.remains)}</div>
    <div class="meta" style="word-break:break-all;opacity:.75">${esc(o.link || "")}</div>
  </div>`;
}

async function viewSmm() {
  if (state.role !== "admin")
    return render(`<div class="empty">Раздел для админов.</div>`);
  const d = await api("/api/smm");
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);
  const cur = d.currency || "";
  const cats = d.categories || [];
  const cat0 = cats.includes(state.smmCat) ? state.smmCat : (cats[0] || "");
  const svcById = id => (d.services || []).find(s => s.id === id);
  const svcOpts = cat => (d.services || []).filter(s => s.category === cat)
    .map(s => `<option value="${esc(s.id)}">#${esc(s.id)} · ${esc(s.name)}</option>`)
    .join("");

  const oh = await api("/api/smm/orders", {refresh: 1});
  const orders = oh.orders || [];

  render(`
    <h1>Услуги</h1>
    <p class="sub">Баланс панели <b>${money(d.balance)} ${esc(cur)}</b> ·
      услуг ${int((d.services || []).length)}</p>
    <div class="card flat">
      <label class="f">Категория</label>
      <select class="text" id="smCat">${cats.map(c =>
        `<option ${c === cat0 ? "selected" : ""} value="${esc(c)}">${esc(c)}</option>`
        ).join("")}</select>
      <label class="f">Услуга</label>
      <select class="text" id="smSvc">${svcOpts(cat0)}</select>
      <div class="meta" id="smHint"></div>
      <label class="f">Ссылка</label>
      <input class="text" id="smLink" placeholder="https://…" spellcheck="false">
      <label class="f">Количество</label>
      <input class="text" id="smQty" inputmode="numeric" placeholder="1000">
      <div class="meta" id="smCost" style="margin-top:6px"></div>
      <button class="act" id="smGo" style="margin-top:10px">Заказать</button>
      <div class="meta" id="smNote" style="margin-top:8px"></div>
    </div>
    <h2>Заказы</h2>
    ${orders.length ? orders.map(smmOrderCard).join("")
      : `<div class="empty">Заказов пока нет.</div>`}`);

  function updateHints() {
    const s = svcById(document.getElementById("smSvc").value);
    const hint = document.getElementById("smHint");
    const cost = document.getElementById("smCost");
    if (!s) { hint.textContent = ""; cost.textContent = ""; return; }
    hint.textContent = `${money(s.rate, 4)} ${cur} за 1000 · от ${int(s.min)} до ${
      int(s.max)}` + (s.dripfeed ? " · dripfeed" : "");
    const q = Number(document.getElementById("smQty").value) || 0;
    cost.innerHTML = q ? `≈ <b>${money(s.rate * q / 1000, 4)} ${esc(cur)}</b> за ${
      int(q)}` : "";
  }
  document.getElementById("smCat")?.addEventListener("change", e => {
    state.smmCat = e.target.value;
    document.getElementById("smSvc").innerHTML = svcOpts(e.target.value);
    updateHints();
  });
  document.getElementById("smSvc")?.addEventListener("change", updateHints);
  document.getElementById("smQty")?.addEventListener("input", updateHints);
  updateHints();

  let armed = false, timer = null;
  document.getElementById("smGo")?.addEventListener("click", async () => {
    const go = document.getElementById("smGo");
    const note = document.getElementById("smNote");
    const svc = document.getElementById("smSvc").value;
    const link = document.getElementById("smLink").value.trim();
    const qty = document.getElementById("smQty").value.trim();
    const s = svcById(svc);
    if (!svc || !link) { note.textContent = "Укажите услугу и ссылку."; return; }
    if (s && s.min && Number(qty) < s.min) {
      note.textContent = `Минимум для этой услуги — ${int(s.min)}.`; return; }
    if (s && s.max && Number(qty) > s.max) {
      note.textContent = `Максимум для этой услуги — ${int(s.max)}.`; return; }
    if (!armed) {                       // второй тап = подтверждение траты
      armed = true;
      go.textContent = (s && qty)
        ? `Подтвердить · ${money(s.rate * Number(qty) / 1000, 4)} ${cur}`
        : "Подтвердить заказ";
      note.textContent = "Нажмите ещё раз, чтобы отправить заказ.";
      clearTimeout(timer);
      timer = setTimeout(() => { armed = false; go.textContent = "Заказать";
        note.textContent = ""; }, 5000);
      return;
    }
    clearTimeout(timer); armed = false; go.disabled = true;
    go.textContent = "Заказать"; note.textContent = "Отправляю в панель…";
    const res = await apiPost("/api/smm/order", {service: svc, link, quantity: qty});
    note.textContent = res.error || res.message;
    go.disabled = false;
    if (!res.error) {
      document.getElementById("smLink").value = "";
      document.getElementById("smQty").value = "";
      tg?.HapticFeedback?.notificationOccurred?.("success");
      setTimeout(() => show("smm"), 1000);
    }
  });
}

async function viewCards() {
  const d = await api("/api/cards", {
    page: state.cardsPage, team: state.cardTeam, state: state.cardState,
    card_id: state.cardId, marketer_id: state.cardMk});
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);
  const t = d.totals || {}, cur = t.currency || "USD";
  const admin = state.role === "admin";
  const sel = d.selected || {};

  // Три величины намеренно разнесены. Проведённые — то, что сравнивается
  // со спендом FB. Комиссии — реальный расход, но не рекламный. Отклонённые
  // деньгами не являются вовсе, но за каждый MyBroCards берёт $0.5.
  const kpis = `
    <div class="kpi hero"><div class="l">Проведено</div>
      <div class="v">${money(t.charged)} <span style="font-size:16px;opacity:.8">${esc(cur)}</span></div>
      <div class="n">settled ${money(t.settled)} · pending ${money(t.pending)}</div></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Комиссии</div><div class="v">${money(t.fees)}</div>
        <div class="n">инфраструктура, не реклама</div></div>
      <div class="kpi"><div class="l">Отклонено</div><div class="v">${int(t.declines)}</div>
        <div class="n">попыток на ${money(t.declined_amount)} — деньги не ушли</div></div>
    </div>
    <div class="count">платежей ${int(t.payments)} · карт ${int(t.cards)} ·
      людей ${int(t.people)}</div>`;

  const stChips = `<div class="chips">` + [["", "Все"], ["settled", "Settled"],
      ["pending", "Pending"], ["declined", "Отклонённые"]]
    .map(([v, l]) => `<button class="chip ${(sel.state || "") === v ? "on" : ""}"
      data-cstate="${v}">${l}</button>`).join("")
    + `</div>`;

  const teamChips = admin && (d.filters?.teams || []).length ?
    `<div class="chips"><button class="chip ${!sel.team ? "on" : ""}" data-cteam="">Все команды</button>` +
    d.filters.teams.map(x => `<button class="chip ${sel.team === x ? "on" : ""}"
      data-cteam="${esc(x)}">${esc(x)}</button>`).join("") + `</div>` : "";

  const people = admin && (d.by_marketer || []).length ? `<h2>По людям</h2>` +
    d.by_marketer.map(m => `<div class="card${m.marketer_id ? "" : " flat"}"
        ${m.marketer_id ? `data-cmk="${esc(m.marketer_id)}"` : ""}>
      <div class="row"><span class="name">${esc(m.name)}</span>
        <span class="money">${money(m.charged)} ${esc(m.currency || cur)}</span></div>
      <div class="meta">${Number(m.emails) > 1
        ? `адресов ${int(m.emails)}` : esc(m.user_email || "почта не известна")}${
        m.team ? " · " + esc(m.team) : ""} · карт ${int(m.cards)} ·
        платежей ${int(m.payments)}</div>
      <div class="meta">отказов ${int(m.declines)} · комиссии ${money(m.fees)}</div>
    </div>`).join("") : "";

  const rows = (d.payments || []).map(p => {
    const ok = ["settled", "pending"].includes(String(p.state).toLowerCase());
    return `<div class="card flat">
      <div class="row">
        <span class="name"><i class="dot ${ok ? "ok" : "bad"}"></i>${
          new Date(p.date).toLocaleString("ru-RU", {day:"numeric", month:"short",
            hour:"2-digit", minute:"2-digit"})}</span>
        <span class="money">${money(p.amount)} ${esc(p.currency || "")}</span></div>
      <div class="meta">•${esc(p.card_last4 || "—")}${
        p.card_bin ? ` · BIN ${esc(p.card_bin)}` : ""}${
        p.card_title ? " · " + esc(p.card_title) : ""}</div>
      <div class="meta">${esc(p.marketer_name || p.user_name || p.user_email || "не привязан")}${
        p.team ? " · " + esc(p.team) : ""}</div>
      <div class="meta">${esc(p.state || "")}${
        p.decline ? " · " + esc(p.decline) : ""}${
        Number(p.fee) ? " · комиссия " + money(p.fee) : ""}${
        p.is_micro ? " · микро" : ""}</div>
      ${p.descriptor ? `<div class="meta">${esc(p.merchant || "")}
        <code>${esc(p.descriptor)}</code></div>` : ""}
    </div>`;
  }).join("");

  const pager = d.pages > 1 ? `<div class="chips" style="margin-top:8px">
    <button class="chip" data-cpage="${Math.max(0, d.page - 1)}" ${d.page === 0 ? "disabled" : ""}>‹ Назад</button>
    <button disabled class="chip on">${d.page + 1} / ${d.pages}</button>
    <button class="chip" data-cpage="${Math.min(d.pages - 1, d.page + 1)}"
      ${d.page + 1 >= d.pages ? "disabled" : ""}>Вперёд ›</button></div>` : "";

  render(`
    <h1>Карты</h1><p class="sub">${esc(d.period_label)}${
      sel.card_id ? " · одна карта" : ""}</p>
    ${periodChips()}
    ${kpis}
    ${sel.card_id || sel.marketer_id ? `<button class="act ghost" data-cclear="1">
      ${ic("close")}Снять фильтр</button>` : ""}
    ${people}
    ${(!admin || sel.card_id || sel.marketer_id)
      ? `<h2>Платежи</h2>${rows || `<div class="empty">За период платежей нет.</div>`}${pager}`
      : `<div class="meta" style="margin-top:14px;text-align:center">Отдельные
         платежи скрыты, чтобы не засорять экран. Нажмите на человека выше —
         увидите его платежи.</div>`}`);
}


// --- ключи внешнего API --------------------------------------------------- //
// Экран короткий намеренно: выпустить, посмотреть кто чем ходит, отозвать.
// Всё остальное про ключ — вопрос доверия, а не интерфейса.
async function viewKeys() {
  const d = await api("/api/keys");
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);
  const keys = d.keys || [];
  const live = keys.filter(k => !k.revoked_at);

  render(`
    <span class="back" data-go="more">‹ Ещё</span>
    <h1>Ключи API</h1>
    <p class="sub">Чтение данных наружу · ${int(live.length)} действующих</p>

    <div class="card flat">
      <div class="name">Выпустить ключ</div>
      <div class="meta">Ключ показывается один раз — в момент выпуска. Хранить
        его у себя, чтобы «посмотреть потом», значит завести второе место,
        откуда он может утечь.</div>
      <label class="f">Название</label>
      <input class="text" id="kName" placeholder="например, выгрузка в 1С"
        spellcheck="false">
      <label class="f">Чьи данные отдавать</label>
      <select class="text" id="kWho">
        <option value="">все кабинеты команды</option>
        ${(d.marketers || []).map(m =>
          `<option value="${esc(m.id)}">только ${esc(m.name)}</option>`).join("")}
      </select>
      <button class="act" id="kAdd">${ic("plus")}Выпустить</button>
      <div id="kNew"></div>
    </div>

    <h2>Как этим пользоваться</h2>
    <div class="card flat">
      <div class="meta">Адрес: <code>${esc(d.base_url || "/api/v1/")}</code></div>
      <div class="meta">Ключ едет заголовком, не в адресе:
        <code>Authorization: Bearer &lt;ключ&gt;</code>. В query-параметре
        не принимаем — URL попадает в логи прокси и в историю браузера,
        и ключ оттуда работает так же.</div>
      <div class="meta" style="margin-top:8px"><b>accounts</b> — реестр кабинетов
        со статусами, лимитами и картами.</div>
      <div class="meta"><b>spend</b> — открут по дням.
        <code>?since=2026-09-01&amp;until=2026-09-30&amp;level=account</code>;
        <code>level=campaign</code> даёт разрез по кампаниям.</div>
      <div class="meta"><b>transactions</b> — фактические списания Facebook.</div>
      <div class="meta"><b>payments</b> — платежи с карт MyBroCards.</div>
      <div class="meta" style="margin-top:8px">Даты обязательны и явные:
        умолчание вроде «за сегодня» опаснее отказа — потребитель, забывший
        период, принял бы день за всё время и не заметил. Страницы —
        <code>limit</code> и <code>offset</code>, в ответе приходит
        <code>next_offset</code>.</div>
      <div class="note">Только чтение. Останавливать кампании и менять бюджеты
        через ключ нельзя: ключ живёт в чужом файле конфигурации, а это
        чужие деньги.</div>
    </div>

    <h2>Выпущенные</h2>
    ${keys.length ? keys.map(k => `<div class="card flat">
      <div class="row">
        <span class="name">${k.revoked_at ? ic("close","dim") : ic("check","ok")}${
          esc(k.name || k.prefix)}</span>
        <span class="meta when">${k.revoked_at ? "отозван " + esc(ago(k.revoked_at))
          : k.last_used_at ? esc(ago(k.last_used_at)) : "не использовался"}</span></div>
      <div class="meta"><code>${esc(k.prefix)}…</code> ·
        ${k.marketer_id ? "только один маркетолог" : "вся команда"} ·
        запросов ${int(k.calls)}${k.last_ip ? " · с " + esc(k.last_ip) : ""}</div>
      <div class="meta">выпущен ${esc(ago(k.created_at))}</div>
      ${k.revoked_at ? "" : `<button class="act ghost" data-revoke="${esc(k.id)}"
        style="margin-top:8px">${ic("trash")}Отозвать</button>`}
    </div>`).join("") : `<div class="empty">Ключей пока нет.</div>`}`);

  document.getElementById("kAdd")?.addEventListener("click", async () => {
    const box = document.getElementById("kNew");
    const name = document.getElementById("kName").value.trim();
    box.innerHTML = `<div class="meta">Выпускаю…</div>`;
    const r = await apiPost("/api/keys/create",
      {name, marketer_id: document.getElementById("kWho").value});
    if (r.error) { box.innerHTML = `<div class="note bad">${esc(r.error)}</div>`; return; }
    // Показываем один раз и крупно: второго шанса не будет.
    box.innerHTML = `<div class="note ok" style="margin-top:10px">
      <b>${esc(r.message)}</b>
      <div style="margin-top:8px"><code style="word-break:break-all">${esc(r.key)}</code></div>
    </div>`;
  });

  document.querySelectorAll("[data-revoke]").forEach(b =>
    b.addEventListener("click", async () => {
      if (!confirm("Отозвать ключ? Всё, что им ходит, перестанет работать сразу.")) return;
      const r = await apiPost("/api/keys/revoke", {id: b.dataset.revoke});
      if (!r.error) show("keys");
    }));
}

// --- бизнес-менеджеры ----------------------------------------------------- //
async function viewBusinesses() {
  const d = await api("/api/businesses", {bm_id: state.bm || ""});
  if (d.error) return render(`<div class="note bad">${esc(d.error)}</div>`);

  if (state.bm) {
    const b = (d.businesses || []).find(x => x.bm_id === state.bm) || {};

    // Люди BM. Доступ к бизнесу сильнее доступа к кабинету: он дотягивается
    // до всех кабинетов внутри, включая те, которых нет в нашем реестре.
    // Приглашения — первыми: доступа ещё нет, но он появится сам.
    // Роли и статус проверки страницы — словами. Переводим только известные:
    // Meta заводит новые молча, и выдуманное слово хуже честной константы.
    const ROLES = {ADMIN:"админ", EMPLOYEE:"сотрудник", DEVELOPER:"разработчик",
      FINANCE_EDITOR:"финансы, полный доступ",
      FINANCE_ANALYST:"финансы, только чтение",
      ADS_RIGHTS_REVIEWER:"проверка прав на рекламу"};
    const VERIFY = {VERIFIED:"подтверждена", NOT_VERIFIED:"не подтверждена",
      EXPIRED:"проверка истекла", PENDING:"на проверке",
      BLUE_VERIFIED:"синяя галочка", GRAY_VERIFIED:"серая галочка"};
    const roleWord = r => ROLES[r] || (r || "").replace(/_/g, " ").toLowerCase();
    const kindMark = {pending: ic("mail","warn"), member: ic("user","dim"),
                      system: ic("bot","dim")};
    const people = (d.users || []).length ? `<h2>Кто имеет доступ · ${
      int(d.users.length)}</h2>` +
      d.users.map(u => `<div class="card flat">
        <div class="row">
          <span class="name">${kindMark[u.kind] || ic("user","dim")}${
            esc(u.name || u.email || u.user_id)}</span>
          <span class="meta">${esc(roleWord(u.role))}</span></div>
        <div class="meta">${u.email && u.name ? esc(u.email) : ""}${
          u.email && u.name && u.title ? " · " : ""}${esc(u.title || "")}${
          u.kind === "pending" ? " · приглашение ещё не принято" : ""}${
          u.two_factor && u.two_factor !== "enabled"
            ? " · <b>без двухфакторки</b>" : ""}</div>
      </div>`).join("") +
      ((d.users || []).some(u => u.kind === "pending")
        ? `<div class="note">Приглашение превратится в доступ само, как только
            его примут — нашего участия для этого не нужно.</div>` : "") : "";

    // Страницы. Клиентская отличается от своей не косметически: её владелец
    // может забрать её в любой момент, и реклама встанет вместе с ней.
    const pages = (d.pages || []).length ? `<h2>Страницы · ${
      int(d.pages.length)}</h2>` +
      d.pages.map(pg => `<div class="card flat">
        <div class="row">
          <span class="name">${pg.kind === "client" ? ic("external","warn") : ic("file","dim")}${
            esc(pg.name || pg.page_id)}</span>
          <span class="meta">${pg.fan_count ? int(pg.fan_count) + " подписчиков" : ""}</span></div>
        <div class="meta">${pg.kind === "client" ? "клиентская — владелец может забрать"
          : "своя"}${pg.category ? " · " + esc(pg.category) : ""}${
          pg.verification_status ? " · " + esc(VERIFY[pg.verification_status]
            || pg.verification_status.toLowerCase()) : ""}${
          pg.is_published ? "" : " · <b>не опубликована</b>"}</div>
        ${pg.link ? `<div class="meta"><a href="${esc(pg.link)}" target="_blank"
          rel="noopener">${esc(pg.link)}</a></div>` : ""}
      </div>`).join("") : "";

    // Пиксели бизнеса. Дополняют пиксели кабинета: пиксель живёт в BM,
    // а к кабинетам привязывается — не привязанный ни к одному в кабинетных
    // списках не виден вообще.
    const bmPixels = (d.pixels || []).length ? `<h2>Пиксели бизнеса · ${
      int(d.pixels.length)}</h2>
      <div class="card flat">
        ${d.pixels.map(px => `<div class="row" style="padding:3px 0">
          <span class="name">${esc(px.name || px.pixel_id)}</span>
          <span class="meta">${px.last_fired_at

// В Telegram клиент отдаёт подпись; в браузере её нет, и вход идёт кукой.
// Признак нужен только для одного: показать выход, которого в Mini App
// быть не должно — там сессией распоряжается сам Telegram.
const inTelegram = !!(tg && tg.initData);

// Виды выдают карточки плоским списком вперемешку с заголовками. Чтобы
// разложить их в колонки на широком экране, оборачиваем каждую непрерывную
// цепочку в контейнер уже после отрисовки — иначе пришлось бы править
// разметку в каждом виде и помнить об этом в каждом будущем.
function groupCards(root) {
  let run = [];
  const flush = () => {
    // Порог в три штуки, а не в две. Пара идущих подряд карточек — почти
    // всегда два разных блока (списание и график, доступ и восстановление),
    // и в двух колонках они не выстраиваются, а слипаются: высоты разные,
    // смысл несвязанный. Список из трёх и длиннее — уже перечисление
    // однотипного, и колонки ему на пользу.
    if (run.length > 2) {
      const box = document.createElement("div");
      box.className = "cards";
      run[0].before(box);
      run.forEach(el => box.appendChild(el));
    }
    run = [];
  };
  [...root.children].forEach(el => {
    if (el.classList.contains("card")) run.push(el);
    else flush();
  });
  flush();
}

function render(html) {
  const bar = state.role === "admin" ? BAR_ADMIN : BAR_MARKETER;
  // Разделы из «Ещё» подсвечивают «Ещё»: своей кнопки в баре у них нет.
  // У маркетолога «Комменты» в баре есть, у админа они уехали в «Ещё».
  const folded = {recon:"more", alerts:"more", health:"more",
                  keys:"more", vault:"more", telegram:"more"};
  // У маркетолога свои разделы: прокси — своей вкладкой в баре,
  // а БМ/креативы ему не показываем вовсе.
  if (state.role !== "admin") {
    folded.businesses = "more"; folded.creatives = "more"; }
  // У админа токены живут в карточке маркетолога — его вход через «Людей».
  if (state.role === "admin") folded.identities = "marketers";
  const active = folded[state.tab] || state.tab;
  const nav = `<div class="tabbar">` + bar.map(code => {
    const [iconName,label]=TABBAR[code];
    return `<button data-go="${code}" class="${active===code?"on":""}">
      <span class="ic">${ic(iconName)}</span>${label}</button>`;
  }).join("")
    // Выход только в браузере: в Mini App сессией распоряжается сам Telegram,
    // и кнопка «Выйти» там означала бы не то, что человек ожидает.
    + (inTelegram ? "" : `<button class="signout" data-signout="1">
        <span class="ic">${ic("exit")}</span>Выйти</button>`)
    + `</div>`;
  app.innerHTML = html + nav;
  groupCards(app);
  // Графики рисуются только теперь: до вставки в документ ширина контейнера
  // неизвестна, а от неё зависят и шаг подписей, и размер шрифта.
  drawCharts(app);
  const q = document.getElementById("q");
  if (q) {
    // Ввод не перерисовывает экран целиком на каждую букву — иначе поле
    // теряет фокус, и печатать в нём невозможно.
    q.addEventListener("input", () => {
      state.q = q.value; state.limit = PAGE;
      clearTimeout(window._qt);
      window._qt = setTimeout(() => {
        const pos = q.selectionStart;
        show(state.tab, state.tab === "accounts" ? state.act
             : state.tab === "identities" ? state.ident : null)
          .then(() => {
            const f = document.getElementById("q");
            if (f) { f.focus(); f.setSelectionRange(pos, pos); }
          });
      }, 220);
    });
  }
  window.scrollTo(0, 0);
}

// Отдельный раздел прокси. Раньше адрес можно было завести только по ходу
// добавления лички — то есть чтобы положить в пул новый прокси, нужно было
// делать вид, что заводишь токен. Здесь пул живёт сам по себе: адреса
// заводят заранее, а лички потом выбирают из готового списка.
// Что именно значит ответ проверки. «Ошибок нет» само по себе ничего не
// говорит: важно, дошли ли до Meta и каким IP нас оттуда видно — от второго
// зависит, доживёт ли на этом прокси сессия.
// Кнопка переключения зависит от того, где мы стоим: в пуле у прокси есть
// id, у лички — своя ручка, а в форме добавления сохранять ещё нечего,
// поэтому там просто подставляем строку в поле.
function pxAltButton(r) {
  // Уже переключено сервером — кнопка не нужна, нужен факт.
  if (r.switched) return `<div class="meta">${ic("check","ok")}Переключил на
    ${esc(r.alt_label)}. Жмите «Проверить доступ» ещё раз.</div>`;
  if (r.px_id) return `<div class="ctl"><button data-pxdns="${esc(r.px_id)}">
    ${ic("swap")}Переключить на ${esc(r.alt_label)}</button></div>`;
  if (r.ident_id) return `<div class="ctl">
    <button data-pxsetalt="${esc(r.ident_id)}" data-alt="${esc(r.alt)}">
    ${ic("swap")}Переключить на ${esc(r.alt_label)}</button></div>`;
  return `<div class="ctl"><button data-pxfill="${esc(r.alt)}">
    ${ic("swap")}Подставить ${esc(r.alt_label)} в поле</button></div>`;
}

function pxVerdict(r) {
  if (r.error && r.ok === undefined) return esc(r.error);
  if (!r.ok) {
    let out = `${ic("close","bad")}Не прошло за ${int(r.ms)} мс. ${esc(r.error || "")}`;
    // Мы уже проверили тот же прокси с разрешением имени на его стороне и
    // знаем, что так он работает. Показываем факт и кнопку — переключаем
    // только по нажатию: схему даёт поставщик, менять её молча не наше дело.
    if (r.alt_failed) out += `<div class="note" style="margin-top:8px">
      ${ic("warn")}Тот же прокси с разрешением имени на его стороне
      (<b>${esc(r.alt_label)}</b>) тоже не прошёл за ${int(r.alt_ms)} мс:
      ${esc(r.alt_failed)}<br>Значит дело не в том, кто резолвит имя —
      с этой машины до прокси либо не доходит, либо он сам наружу не пускает.</div>`;
    if (r.alt) out += `<div class="note" style="margin-top:8px">
      ${ic("check","ok")}А через <b>${esc(r.alt_label)}</b> прошло за
      ${int(r.alt_ms)} мс${r.alt_ip ? ` · наружу с ${esc(r.alt_ip)}` : ""}.
      Разница одна: кто превращает имя graph.facebook.com в адрес — наша
      машина или сам прокси. Сам прокси у вас рабочий.
      ${pxAltButton(r)}</div>`;
    return out;
  }
  return `${ic("check","ok")}Meta ответила за ${int(r.ms)} мс`
    + (r.ip ? ` · наружу выходим с ${esc(r.ip)}` : "")
    + (r.meta ? ` · «${esc(r.meta)}» — это нормально, мы стучались без токена` : "");
}

// Раздел живёт в «Ещё» у админа. Четыре вкладки внутри: аккаунты, каналы,
// публикация, коды. Действия от имени аккаунта уходят задачей воркеру —
// поэтому после нажатия мы опрашиваем задачу, а не ждём ответа ручки.
const TG_TABS = [["accounts","Аккаунты"],["channels","Каналы"],
                 ["post","Публикация"],["codes","Коды"]];
const TG_KIND = {ok:"ok", spamblock:"warn", frozen:"bad", revoked:"bad",
  banned:"bad", error:"warn", unknown:"warn", new:"off", code_sent:"info",
  password_needed:"info"};
const JOB_WORD = {pending:"в очереди", running:"выполняется", done:"готово",
  failed:"не вышло", unknown:"неизвестно — проверьте канал", cancelled:"отменено"};
const JOB_KIND = {pending:"info", running:"info", done:"ok", failed:"bad",
  unknown:"warn", cancelled:"off"};
let TG_POLL = null;

function tgName(a) {
  return esc(a.label || (a.username ? "@" + a.username : a.phone) || a.id);
}
function tgWhen(stamp) {
  if (!stamp) return "—";
  const d = new Date(stamp);
  return isNaN(d) ? esc(stamp) : d.toLocaleString("ru-RU",
    {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
}

// Опросить задачу воркера до конца и показать итог в note.
async function tgWait(jobId, note, done) {
  for (let i = 0; i < 60; i++) {
    const r = await api("/api/tg/job", {id: jobId});
    const j = r.job;
    if (!j) { note.className = "ctlnote bad"; note.textContent = r.error || "?"; return; }
    if (!["pending","running"].includes(j.status)) {
      note.className = "ctlnote " + (j.status === "done" ? "ok" : "bad");
      note.innerHTML = j.status === "done" ? tgResult(j)
        : esc(JOB_WORD[j.status] + (j.error ? ": " + j.error : ""));
      done?.(j);
      return;
    }
    note.className = "ctlnote";
    note.textContent = j.status === "pending" ? "В очереди у воркера…" : "Выполняется…";
    await new Promise(res => setTimeout(res, 1500));
  }
  note.textContent = "Воркер долго не отвечает — проверьте, что служба admetrics-tg запущена.";
}
function tgResult(j) {
  const r = j.result || {};
  if (j.kind === "post") return `${ic("check","ok")}Опубликовано${r.link
    ? ` · <a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link)}</a>` : ""}`;
  if (j.kind === "sync") return `${ic("check","ok")}Каналов и групп с правами: ${int(r.channels)}`;
  if (j.kind === "spamcheck") return `${ic("check","ok")}@SpamBot: ${esc(r.status)} — ${esc(r.answer || "")}`;
  if (j.kind === "check") return `${ic("check","ok")}На связи: ${esc(r.first_name || "")}${
    r.username ? " @" + esc(r.username) : ""}`;
  return "Готово";
}

  return tgAccounts(head(d), d);

async function tgAccounts(head, d) {
  const pf = await proxyField("Tg");
  const pfi = await proxyField("TgImp");
  const card = a => `
    <div class="card" data-tgacc="${esc(a.id)}">
      <div class="row">
        <span class="name">${dot(a.enabled ? (TG_KIND[a.status] || "off") : "off")}${tgName(a)}</span>
        <span class="meta when">${a.enabled ? esc(a.status_text) : "выключен"}</span>
      </div>
      <div class="meta">${a.username ? "@" + esc(a.username) + " · " : ""}${esc(a.phone || "")}${
        a.has_2fa ? " · 2FA сохранён" : ""}</div>
      ${a.status_note && a.status !== "ok" ? `<div class="meta">${esc(a.status_note)}</div>` : ""}
      <div class="meta">${ic("swap")}${esc(a.proxy_hint || "без прокси")} ·
        каналов ${int(a.channels)}${a.channels_owned ? ` (владелец в ${int(a.channels_owned)})` : ""}
        · кодов за сутки ${int(a.codes_24h)}
        ${a.last_ok_at ? " · на связи " + esc(ago(a.last_ok_at)) : ""}</div>
    </div>`;
  const list = d.accounts.length ? `<h2>Аккаунты · ${int(d.accounts.length)}</h2>
      ${d.accounts.map(card).join("")}`
      : `<div class="empty">Аккаунтов пока нет — добавьте первый ниже.</div>`;
  // Список первым: на этот экран чаще приходят посмотреть, кто жив, чем
  // заводить новый. Формы свёрнуты, пока аккаунты есть.
  const fold = d.accounts.length ? "" : " open";
  render(`${head}
    ${list}
    <details class="tgform"${fold}><summary><h2>${ic("plus")}Войти по номеру</h2></summary>
    <div class="card flat">
      <label class="f">Название</label>
      <input class="text" id="tgLabel" placeholder="напр. TG-07 канал BR">
      <label class="f">Номер</label>
      <input class="text" id="tgPhone" placeholder="+79991234567" inputmode="tel">
      ${pf}
      <div class="ctl"><button id="tgSend">${ic("mail")}Запросить код</button></div>
      <div id="tgStep"></div>
      <div class="ctlnote" id="tgNote">Код придёт в Telegram на другом устройстве этого
        аккаунта или по SMS. Прокси — постоянный, без ротации: новый IP при каждом
        входе Telegram считает подозрительным.</div>
    </div></details>
    <details class="tgform"${fold}><summary><h2>${ic("plus")}Импорт готовой сессии</h2></summary>
    <div class="card flat">
      <label class="f">Строка сессии (Telethon или Pyrogram)</label>
      <textarea id="tgSess" spellcheck="false" placeholder="1BVtsOK…"></textarea>
      <label class="f">…или файл .session (Telethon)</label>
      <input type="file" id="tgFile" accept=".session">
      <label class="f">Название (необязательно)</label>
      <input class="text" id="tgImpLabel">
      <label class="f">Пароль 2FA (необязательно, хранится шифрованно)</label>
      <input class="text" id="tgImp2fa" type="password" autocomplete="off">
      ${pfi}
      <div class="ctl"><button id="tgImport">${ic("plus")}Импортировать</button></div>
      <div class="ctlnote" id="tgImpNote">tdata (Telegram Desktop) не принимаем —
        попросите у продавца .session.</div>
    </div></details>`);
  proxyWire("Tg"); proxyWire("TgImp");

  let tgId = null;
  const note = document.getElementById("tgNote");
  const step = document.getElementById("tgStep");
  const showStep = (r) => {
    note.className = "ctlnote " + (r.error ? "bad" : "ok");
    note.textContent = r.error || r.message;
    if (r.step === "code") step.innerHTML = `<label class="f">Код</label>
      <input class="text" id="tgCode" inputmode="numeric" autocomplete="one-time-code">
      <div class="ctl"><button id="tgCodeGo">${ic("check")}Войти</button></div>`;
    else if (r.step === "password") step.innerHTML = `<label class="f">Пароль 2FA</label>
      <input class="text" id="tgPw" type="password" autocomplete="off">
      <div class="ctl"><button id="tgPwGo">${ic("key")}Войти</button></div>`;
    else if (r.step === "done") { step.innerHTML = "";
      tg?.HapticFeedback?.notificationOccurred?.("success");
      setTimeout(() => show("telegram"), 1500); }
  };
  document.getElementById("tgSend").onclick = async () => {
    note.className = "ctlnote"; note.textContent = "Подключаюсь через прокси, прошу код…";
    const r = await apiPost("/api/tg/add", {label: document.getElementById("tgLabel").value,
      phone: document.getElementById("tgPhone").value, ...proxyValue("Tg")});
    if (r.id) tgId = r.id;
    showStep(r);
  };
  step.addEventListener("click", async e => {
    if (e.target.closest("#tgCodeGo")) {
      note.textContent = "Проверяю код…";
      showStep(await apiPost("/api/tg/login/code",
        {id: tgId, code: document.getElementById("tgCode").value}));
    }
    if (e.target.closest("#tgPwGo")) {
      note.textContent = "Проверяю пароль…";
      showStep(await apiPost("/api/tg/login/password",
        {id: tgId, password: document.getElementById("tgPw").value}));
    }
  });
  document.getElementById("tgImport").onclick = async () => {
    const n = document.getElementById("tgImpNote");
    const f = document.getElementById("tgFile").files[0];
    const body = {session: document.getElementById("tgSess").value,
      label: document.getElementById("tgImpLabel").value,
      twofa: document.getElementById("tgImp2fa").value, ...proxyValue("TgImp")};
    if (f) {
      const buf = new Uint8Array(await f.arrayBuffer());
      let bin = ""; buf.forEach(b => bin += String.fromCharCode(b));
      body.file_b64 = btoa(bin);
    }
    n.className = "ctlnote"; n.textContent = "Проверяю сессию через прокси…";
    const r = await apiPost("/api/tg/import", body);
    n.className = "ctlnote " + (r.error ? "bad" : "ok");
    n.textContent = r.error || r.message;
    if (!r.error) setTimeout(() => show("telegram"), 1500);
  };
}

      inputmode="numeric" placeholder="код"><div class="ctl"><button id="tgReCodeGo">Войти</button></div>`;

      {id, password: document.getElementById("tgRePw").value}));

  document.getElementById("tgRenGo").onclick = async () => say(setNote,
    await apiPost("/api/tg/rename", {id, label: document.getElementById("tgRen").value}));
  document.getElementById("tgPxGo").onclick = async () => {
    const r = await apiPost("/api/tg/proxy", {id, ...proxyValue("TgEd")});
    say(setNote, r); if (!r.error) PROXY_POOL = [];
  };
  document.getElementById("tgTwofaGo").onclick = async () => say(setNote,
    await apiPost("/api/tg/twofa", {id, password: document.getElementById("tgTwofa").value}));
  tgWireCodes();
}

function tgCodeList(list) {
  if (!list.length) return `<div class="empty">Кодов за сутки не было.</div>`;
  return list.map(c => `<div class="card flat" data-tgcoderow="${esc(c.id)}">
    <div class="row"><span class="name">${ic("key")}${esc(c.label || c.username || c.phone || "")}</span>
      <span class="meta when">${tgWhen(c.received_at)}</span></div>
    <div class="meta">от ${esc(c.sender)}${c.viewed_at ? ` · смотрел ${esc(c.viewed_by)} ${esc(ago(c.viewed_at))}` : ""}</div>
    <div class="ctl"><button data-tgreveal="${esc(c.id)}">${ic("search")}Показать</button></div>
    <div class="ctlnote" data-tgcode="${esc(c.id)}"></div></div>`).join("");
}
function tgWireCodes() {
  app.querySelectorAll("[data-tgreveal]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const id = b.dataset.tgreveal;
    const box = app.querySelector(`[data-tgcode="${id}"]`);
    const r = await apiPost("/api/tg/code/reveal", {id});
    if (r.error) { box.className = "ctlnote bad"; box.textContent = r.error; return; }
    box.className = "ctlnote";
    box.innerHTML = `<div style="font-size:28px;font-weight:700;letter-spacing:4px;
      color:var(--text)">${esc(r.code.code || "—")}</div><div>${esc(r.code.text)}</div>
      <div class="meta">скроется через минуту · показ записан в журнал</div>`;
    setTimeout(() => { box.innerHTML = ""; }, 60000);
  });
}

async function tgCodes(head) {

      const body = {chat_id: chan.value, account_id: document.getElementById("tgAs").value,
        text: txt.value, media_url: document.getElementById("tgMedia").value,
        html: document.getElementById("tgHtml").checked,
        silent: document.getElementById("tgSilent").checked,
        preview: document.getElementById("tgPrev").checked,
        run_at: at ? new Date(at).toISOString() : ""};
      const where = chan.options[chan.selectedIndex].text;
      if (!confirm(at ? `Запланировать пост в «${where}» на ${new Date(at).toLocaleString("ru-RU")}?`
                      : `Опубликовать в «${where}» сейчас?`)) return;
      btn.disabled = true;
      const r = await apiPost("/api/tg/post", body);
      if (r.error) { btn.disabled = false; note.className = "ctlnote bad";
                     note.textContent = r.error; return; }
      if (at) { note.className = "ctlnote ok"; note.textContent = r.message;
                setTimeout(() => show("telegram"), 1200); return; }
      tgWait(r.job_id, note, () => { txt.value = ""; btn.disabled = false; upd(); });
    };
  }
  app.querySelectorAll("[data-tgcancel]").forEach(b => b.onclick = async () => {
    const r = await apiPost("/api/tg/job/cancel", {id: b.dataset.tgcancel});
    if (r.error) alert(r.error); show("telegram");
  });
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tgtab]");
  if (t) { state.tgTab = t.dataset.tgtab; return show("telegram"); }
  if (e.target.closest("[data-tgback]")) { state.tgAcc = null; return show("telegram"); }
  const acc = e.target.closest("[data-tgacc]");
  if (acc && !e.target.closest("button,input,select,textarea,a")) {
    state.tgAcc = acc.dataset.tgacc; return show("telegram", state.tgAcc); }
});

async function show(tab, arg) {
  state.tab = tab;
  if (!document.getElementById("q")) app.innerHTML = `<div class="empty">Загружаю…</div>`;
  if (tab === "home") return viewHome();
  if (tab === "accounts") return arg ? viewAccount(arg) : viewAccounts();
  if (tab === "campaigns") return viewCampaigns(arg);
  if (tab === "identities") return arg ? viewIdentity(arg) : viewIdentities();
  if (tab === "marketers") return arg ? viewMarketer(arg) : viewMarketers();
  if (tab === "alerts") return viewAlerts();
  if (tab === "health") return viewHealth();
  if (tab === "more") return viewMore();
  if (tab === "telegram") return viewTelegram(arg);
  if (tab === "recon") return viewRecon();
  if (tab === "comments") return viewComments();
  if (tab === "cards") {
    // «Сегодня» на этом экране почти всегда ноль: платежи приходят пачками
    // и с лагом расчётов. Поэтому 30 дней — начальное значение при ПЕРВОМ
    // заходе. Но если человек сам ткнул «Сегодня» на этом экране, его выбор
    // уважаем — иначе кнопка выглядит сломанной (период возвращается назад).
    if (!state.cardsPeriodTouched && state.period === "today") state.period = "30d";
    return viewCards();
  }
  if (tab === "businesses") return viewBusinesses();
  if (tab === "keys") return viewKeys();
  if (tab === "proxies") return viewProxies();
  if (tab === "vault") return viewVault();
  if (tab === "creatives") return viewCreatives();
  if (tab === "smm") return viewSmm();
}

app.addEventListener("change", e => {
  const sel = e.target.closest("[data-pxsel]");
  if (!sel) return;
  const inp = document.querySelector(`[data-pxnew="${sel.dataset.pxsel}"]`);
  if (inp) inp.hidden = sel.value !== "__new__";
});

app.addEventListener("click", e => {
  const period = e.target.closest("[data-period]");
  if (period) {
    state.period = period.dataset.period; state.limit = PAGE;
    state.cardsPage = 0; state.customOpen = false;
    // Ручной выбор периода на экране карт отключает авто-подстановку 30 дней.
    if (state.tab === "cards") state.cardsPeriodTouched = true;
    return show(state.tab, state.tab === "accounts" ? state.act
                : state.tab === "identities" ? state.ident
                : state.tab === "marketers" ? state.mk : null);
  }
  if (e.target.closest("[data-rangetoggle]")) {
    // «Свой период» — это отдельный режим: включаем его и показываем поля.
    // Повторный тап по нему закрывает и возвращает к пресету.
    state.customOpen = !state.customOpen && !isRange(state.period);
    return show(state.tab, state.tab === "accounts" ? state.act
                : state.tab === "identities" ? state.ident
                : state.tab === "marketers" ? state.mk : null);
  }
  if (e.target.closest("[data-rangeapply]")) {
    const from = document.getElementById("rFrom")?.value;
    const to = document.getElementById("rTo")?.value;
    if (!from || !to) return;          // пустое поле — не период, а опечатка
    state.period = from <= to ? `${from}..${to}` : `${to}..${from}`;
    state.limit = PAGE; state.cardsPage = 0; state.customOpen = false;
    return show(state.tab, state.tab === "accounts" ? state.act
                : state.tab === "identities" ? state.ident
                : state.tab === "marketers" ? state.mk : null);
  }
  const probe = e.target.closest("[data-probe]");
  if (probe) {
    e.stopPropagation();          // карточка-родитель не должна открываться
    const id = probe.dataset.probe;
    const note = document.querySelector(`[data-probenote="${id}"]`);
    probe.disabled = true;
    if (note) { note.className = "ctlnote"; note.textContent = "Стучусь в Meta…"; }
    apiPost("/api/proxy/check", {identity_id: id}).then(r => {
      probe.disabled = false;
      if (!note) return;
      if (r.error && r.ok === undefined) {
        note.className = "ctlnote bad"; note.textContent = r.error; return;
      }
      if (r.ok) {
        note.className = "ctlnote ok";
        note.textContent = `Meta отвечает: ${r.who} · ${r.via} · ${r.ms} мс`
          + (r.fixed ? ` · статус поправлен: было «${r.was}»` : "");
        if (r.fixed) setTimeout(() => show(state.tab, state.ident), 1400);
      } else {
        note.className = "ctlnote bad";
        note.innerHTML = `Не достучались через ${esc(r.via)} за ${int(r.ms)} мс.
          ${esc(r.error)}`
          + (r.alt_failed ? `<div class="note" style="margin-top:8px">
              ${ic("warn")}И с разрешением имени на стороне прокси
              (<b>${esc(r.alt_label)}</b>) не прошло за ${int(r.alt_ms)} мс:
              ${esc(r.alt_failed)}<br>Значит дело не в DNS — с этой машины
              до прокси либо не доходит, либо он сам наружу не пускает.</div>` : "")
          + (r.alt ? `<div class="note" style="margin-top:8px">
              ${ic("check","ok")}А через <b>${esc(r.alt_label)}</b> прошло за
              ${int(r.alt_ms)} мс${r.alt_ip ? ` · наружу с ${esc(r.alt_ip)}` : ""}.
              Разница одна: кто превращает имя graph.facebook.com в адрес —
              наша машина или сам прокси. Сам прокси у вас рабочий.
              ${pxAltButton({...r, ident_id: id})}</div>` : "");
      }
    });
    return;
  }
  // Переключение на удалённый DNS — только отсюда, только по нажатию.
  const pxdns = e.target.closest("[data-pxdns]");
  if (pxdns) {
    e.stopPropagation();
    pxdns.disabled = true;
    apiPost("/api/proxy/setdns", {id: pxdns.dataset.pxdns}).then(r => {
      pxdns.disabled = false;
      if (r.error) { pxdns.textContent = r.error; return; }
      PROXY_POOL = []; show("proxies");
    });
    return;
  }
  const pxsetalt = e.target.closest("[data-pxsetalt]");
  if (pxsetalt) {
    e.stopPropagation();
    pxsetalt.disabled = true;
    apiPost("/api/identity/proxy", {identity_id: pxsetalt.dataset.pxsetalt,
                                    proxy: pxsetalt.dataset.alt}).then(r => {
      pxsetalt.disabled = false;
      if (r.error) { pxsetalt.textContent = r.error; return; }
      PROXY_POOL = [];
      setTimeout(() => show(state.tab,
        state.tab === "identities" ? state.ident
        : state.tab === "marketers" ? state.mk
        : state.tab === "accounts" ? state.act : null), 600);
    });
    return;
  }
  const pxfill = e.target.closest("[data-pxfill]");
  if (pxfill) {
    e.stopPropagation();
    const f = document.getElementById("pxUrl");
    if (f) { f.value = pxfill.dataset.pxfill; f.focus(); }
    return;
  }
  const vault = e.target.closest("[data-vault]");
  if (vault) {
    const name = vault.dataset.vault;
    const box = vault.querySelector("[data-vaultbox]");
    if (!box) return;
    if (box.innerHTML) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="meta">Загружаю…</div>`;
    api("/api/recovery/one", {session: name}).then(r => {
      if (r.error) { box.innerHTML = `<div class="note bad">${esc(r.error)}</div>`; return; }
      box.innerHTML = recoveryCard(r.recovery, r.session);
      mountRecovery(r.recovery);
    });
    return;
  }
  // Раскрытие узла дерева кампаний. Делегированно: узлы появляются по мере
  // загрузки, и вешать слушатель на каждый заново — лишняя работа.
  const tog = e.target.closest("[data-toggle]");
  if (tog) {
    const wrap = document.getElementById("campWrap");
    if (wrap) openNode(wrap, tog.dataset.toggle, wrap.dataset.act, wrap.dataset.cur);
    return;
  }

  const pxtest = e.target.closest("[data-pxtest]");
  if (pxtest) {
    e.stopPropagation();
    const id = pxtest.dataset.pxtest;
    const note = document.querySelector(`[data-pxrow="${id}"]`);
    pxtest.disabled = true;
    if (note) { note.className = "ctlnote"; note.textContent = "Стучусь через него в Meta…"; }
    apiPost("/api/proxy/probe", {id}).then(r => {
      pxtest.disabled = false;
      if (!note) return;
      note.className = "ctlnote " + (r.ok ? "ok" : "bad");
      note.innerHTML = pxVerdict({...r, px_id: id});
    });
    return;
  }

  // --- пул прокси: переименовать / убрать ------------------------------ //
  const pxren = e.target.closest("[data-pxren]");
  if (pxren) {
    e.stopPropagation();
    const id = pxren.dataset.pxren;
    const note = document.querySelector(`[data-pxrow="${id}"]`);
    const card = pxren.closest("[data-px]");
    const cur = card?.querySelector(".name")?.textContent.trim() || "";
    const box = document.createElement("div");
    box.innerHTML = `<input class="text" id="pxRen" value="${esc(cur)}"
      placeholder="как называть этот адрес">
      <div class="ctl"><button data-pxrensave="${esc(id)}">Сохранить</button></div>`;
    if (note) { note.className = "ctlnote"; note.textContent = ""; note.appendChild(box); }
    return;
  }
  const pxrensave = e.target.closest("[data-pxrensave]");
  if (pxrensave) {
    e.stopPropagation();
    const id = pxrensave.dataset.pxrensave;
    const label = document.getElementById("pxRen")?.value.trim() || "";
    apiPost("/api/proxy/rename", {id, label}).then(() => {
      PROXY_POOL = []; show("proxies");
    });
    return;
  }
  const pxdel = e.target.closest("[data-pxdel]");
  if (pxdel) {
    e.stopPropagation();
    const id = pxdel.dataset.pxdel;
    const note = document.querySelector(`[data-pxrow="${id}"]`);
    pxdel.disabled = true;
    apiPost("/api/proxy/delete", {id}).then(r => {
      pxdel.disabled = false;
      if (r.error) {
        if (note) { note.className = "ctlnote bad"; note.textContent = r.error; }
        return;
      }
      PROXY_POOL = []; show("proxies");
    });
    return;
  }

  // --- смена прокси у лички ------------------------------------------ //
  const pxopen = e.target.closest("[data-pxopen]");
  if (pxopen) {
    e.stopPropagation();        // карточка-родитель не должна открываться
    const box = document.querySelector(`[data-pxedit="${pxopen.dataset.pxopen}"]`);
    if (box) box.hidden = !box.hidden;
    return;
  }
  const pxsave = e.target.closest("[data-pxsave]");
  const pxclear = e.target.closest("[data-pxclear]");
  if (pxsave || pxclear) {
    e.stopPropagation();
    const btn = pxsave || pxclear;
    const id = btn.dataset.pxsave || btn.dataset.pxclear;
    const sel = document.querySelector(`[data-pxsel="${id}"]`);
    const inp = document.querySelector(`[data-pxnew="${id}"]`);
    const note = document.querySelector(`[data-pxnote="${id}"]`);
    let body = {identity_id: id};
    if (pxclear) body.clear = 1;
    else if (sel?.value === "__new__") body.proxy = (inp?.value || "").trim();
    else body.proxy_id = sel?.value || "";
    btn.disabled = true;
    if (note) { note.className = "ctlnote"; note.textContent = "Меняю прокси…"; }
    apiPost("/api/identity/proxy", body).then(r => {
      btn.disabled = false;
      if (note) {
        note.className = "ctlnote " + (r.error ? "bad" : "ok");
        note.textContent = r.error || r.message;
      }
      if (r.error) return;
      // Пул мог пополниться только что введённым адресом, а статус лички
      // сброшен в «не проверена» — перерисовываем, чтобы человек видел
      // и новый адрес, и то, что доступ теперь надо проверить заново.
      PROXY_POOL = [];
      tg?.HapticFeedback?.notificationOccurred?.("success");
      setTimeout(() => show(state.tab,
        state.tab === "identities" ? state.ident
        : state.tab === "marketers" ? state.mk
        : state.tab === "accounts" ? state.act : null), 1200);
    });
    return;
  }

  // Значки поиск/фильтр/сортировка разворачивают нужный блок; повторный
  // клик по активному значку — сворачивает. Без этого панель не реагирует.
  const ctrl = e.target.closest("[data-ctrl]");
  if (ctrl) {
    const k = ctrl.dataset.ctrl;
    state.ctrlOpen = state.ctrlOpen === k ? "" : k;
    return show(state.tab);
  }
  const filter = e.target.closest("[data-filter]");
  if (filter) { state.filter = filter.dataset.filter; state.limit = PAGE;
                return show(state.tab); }
  const sort = e.target.closest("[data-sort]");
  if (sort) { state.sort = sort.dataset.sort; return show(state.tab); }
  const more = e.target.closest("[data-more]");
  if (more) { state.limit += PAGE; return show(state.tab); }

  // Переключатель «все / только живые» на вкладке креативов.
  const creolive = e.target.closest("[data-creolive]");
  if (creolive) { state.creoLive = !state.creoLive; state.limit = PAGE;
                  return show("creatives"); }

  // Фильтры и страницы раздела карт. Каждый сбрасывает страницу на первую:
  // иначе после сужения фильтра человек оказывается на странице 7 из 2.
  const cstate = e.target.closest("[data-cstate]");
  if (cstate) { state.cardState = cstate.dataset.cstate; state.cardsPage = 0;
                return show("cards"); }
  const cteam = e.target.closest("[data-cteam]");
  if (cteam) { state.cardTeam = cteam.dataset.cteam; state.cardsPage = 0;
               return show("cards"); }
  const cmk = e.target.closest("[data-cmk]");
  if (cmk) { state.cardMk = cmk.dataset.cmk; state.cardsPage = 0;
             return show("cards"); }
  const cpage = e.target.closest("[data-cpage]");
  if (cpage) { state.cardsPage = Number(cpage.dataset.cpage) || 0;
               return show("cards"); }
  if (e.target.closest("[data-cclear]")) {
    state.cardMk = state.cardId = state.cardTeam = ""; state.cardsPage = 0;
    return show("cards");
  }
  const bm = e.target.closest("[data-bm]");
  if (bm) { state.bm = bm.dataset.bm; return show("businesses"); }

  if (e.target.closest("[data-signout]")) { location.href = "/logout"; return; }

  const go = e.target.closest("[data-go]");
  if (go) {
    state.act = state.ident = state.mk = state.bm = null;
    state.q = ""; state.limit = PAGE;
    state.cardsPage = 0;
    state.filter = go.dataset.preset === "broken" ? "broken"
                 : go.dataset.preset === "noaccess" ? "noaccess" : "all";
    return show(go.dataset.go);
  }
  const camp = e.target.closest("[data-campaigns]");
  if (camp) return show("campaigns", camp.dataset.campaigns);
  const backAct = e.target.closest("[data-act-back]");
  if (backAct) { state.act = backAct.dataset.actBack;
                 return show("accounts", state.act); }
  const act = e.target.closest("[data-act]");
  if (act) { state.act = act.dataset.act; return show("accounts", state.act); }
  const ident = e.target.closest("[data-ident]");
  if (ident) { state.ident = ident.dataset.ident;
               return show("identities", state.ident); }
  const mk = e.target.closest("[data-mk]");
  if (mk) { state.mk = mk.dataset.mk; return show("marketers", state.mk); }
});

show("home");
</script>
